<!-- Error display: catches Babel parse errors and unhandled JS exceptions -->
<script>
(function(){
  var shown=false;
  function showErr(msg,src,line){
    if(shown||document.getElementById('root').childNodes.length)return;
    shown=true;
    var root=document.getElementById('root');
    root.textContent='';
    var box=document.createElement('div');
    box.style.cssText='padding:40px;font-family:system-ui,sans-serif;background:#fff;min-height:100vh';
    var inner=document.createElement('div');
    inner.style.cssText='max-width:500px;margin:0 auto;padding-top:80px';
    var icon=document.createElement('div');
    icon.style.cssText='width:52px;height:52px;background:#FEF2F2;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:20px';
    icon.textContent='⚠️';
    var h2=document.createElement('h2');
    h2.style.cssText='font-size:18px;font-weight:800;color:#111827;margin:0 0 8px';
    h2.textContent='Falha ao carregar o sistema';
    var pMsg=document.createElement('p');
    pMsg.style.cssText='font-size:13px;color:#6B7280;line-height:1.6;margin:0 0 6px';
    pMsg.textContent=String(msg||'');
    inner.appendChild(icon);inner.appendChild(h2);inner.appendChild(pMsg);
    if(src){
      var pSrc=document.createElement('p');
      pSrc.style.cssText='font-size:11px;color:#9CA3AF;margin:0 0 20px';
      pSrc.textContent=String(src)+(line?':'+String(line):'');
      inner.appendChild(pSrc);
    }
    var btn=document.createElement('button');
    btn.style.cssText='padding:10px 20px;background:#1955FF;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer';
    btn.textContent='↻ Tentar novamente';
    btn.onclick=function(){location.reload();};
    var pHint=document.createElement('p');
    pHint.style.cssText='font-size:11px;color:#9CA3AF;margin-top:12px';
    pHint.textContent='Se o problema persistir, pressione Ctrl+Shift+R para limpar o cache.';
    inner.appendChild(btn);inner.appendChild(pHint);
    box.appendChild(inner);root.appendChild(box);
  }
  window.addEventListener('error',function(e){showErr(e.message,e.filename,e.lineno);});
  window.addEventListener('unhandledrejection',function(e){
    var msg=(e.reason&&e.reason.message)||String(e.reason)||'Erro de rede';
    showErr(msg,'','');
  });
})();
</script>

const MOBILE_BREAKPOINT=768;
function useIsMobile(){
  const query=`(max-width:${MOBILE_BREAKPOINT}px)`;
  const[mobile,setMobile]=useState(()=>typeof window!=="undefined"&&window.matchMedia(query).matches);
  useEffect(()=>{
    const mq=window.matchMedia(query);
    const handler=e=>setMobile(e.matches);
    setMobile(mq.matches);
    if(mq.addEventListener)mq.addEventListener("change",handler);
    else mq.addListener(handler);
    return()=>{if(mq.removeEventListener)mq.removeEventListener("change",handler);else mq.removeListener(handler);};
  },[]);
  return mobile;
}

function fmtDate(d){
  if(!d)return "—";
  const dt=new Date(d+(String(d).length<=10?"T00:00:00":""));
  if(isNaN(dt))return "—";
  return dt.toLocaleDateString("pt-BR");
}
function fmtDateTime(d){
  if(!d)return "—";
  const dt=new Date(d);
  if(isNaN(dt))return "—";
  return dt.toLocaleDateString("pt-BR")+" às "+dt.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
}
function getInitials(name){
  if(!name)return "US";
  const parts=String(name).trim().split(/\s+/).slice(0,2);
  return parts.map(p=>p[0]?.toUpperCase()||"").join("")||"US";
}
function diasEntre(d1,d2=new Date()){

function Spinner({size=16,color="#1955FF"}){
  return(
    <svg className="spin" width={size} height={size} viewBox="0 0 24 24" fill="none">
      <circle cx="12" cy="12" r="10" stroke={color} strokeWidth="3" opacity=".2"/>

function Field({label,required,children,as,hint}){
  const Tag=as||"label";
  return(
    <Tag style={{display:"block"}}>
      {label&&<div style={{fontSize:12,fontWeight:700,color:"#374151",marginBottom:6,letterSpacing:".3px"}}>
        {label}{required&&<span style={{color:"#DC2626"}}> *</span>}
      </div>}
      {children}
      {hint&&<div style={{fontSize:11,color:"#9CA3AF",marginTop:4}}>{hint}</div>}
    </Tag>
  );
}
const inputStyle={
  width:"100%",padding:"10px 12px",fontSize:14,borderRadius:9,
  border:"1.5px solid #E5E7EB",color:"#111827",background:"#fff",
  transition:"border-color .15s",
};

function Modal({title,onClose,children,width=480,footer}){
  return(
    <div className="fade" style={{position:"fixed",inset:0,zIndex:2000,background:"rgba(15,23,42,.5)",
      display:"flex",alignItems:"center",justifyContent:"center",padding:16}} onClick={onClose}>
      <div className="up" style={{width:"100%",maxWidth:width,maxHeight:"88vh",background:"#fff",borderRadius:18,
        boxShadow:"0 20px 60px rgba(0,0,0,.25)",display:"flex",flexDirection:"column",overflow:"hidden"}}
        onClick={e=>e.stopPropagation()}>
        <div style={{padding:"18px 22px",borderBottom:"1px solid #F1F5F9",display:"flex",alignItems:"center",justifyContent:"space-between"}}>

          <button onClick={onClose} style={{border:"none",background:"#F3F4F6",borderRadius:8,width:28,height:28,
            display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",color:"#6B7280"}}>
            <X size={15}/>
          </button>
        </div>
        <div style={{padding:22,overflowY:"auto",flex:1}}>{children}</div>
        {footer&&<div style={{padding:"16px 22px",borderTop:"1px solid #F1F5F9",display:"flex",justifyContent:"flex-end",gap:10}}>{footer}</div>}
      </div>

}
function BtnPrimary({children,onClick,disabled,loading,type="button",danger}){
  return(
    <button type={type} onClick={onClick} disabled={disabled||loading} className="btnblue"
      style={{padding:"10px 18px",borderRadius:9,border:"none",
        background:danger?"#DC2626":BLUE,color:"#fff",fontWeight:700,fontSize:13,
        cursor:(disabled||loading)?"not-allowed":"pointer",display:"flex",alignItems:"center",gap:8,
        whiteSpace:"nowrap",flexShrink:0,opacity:(disabled)?.5:1}}>

}
function BtnSecondary({children,onClick,disabled}){
  return(
    <button type="button" onClick={onClick} disabled={disabled}

        background:"#fff",color:"#374151",fontWeight:700,fontSize:13,cursor:disabled?"not-allowed":"pointer",

function ErrorBox({children}){
  if(!children)return null;

const PROD_TURNSTILE_SITE_KEY="0x4AAAAAAD7cl8ffY5GysVNZ";
// Chave pública de teste do Cloudflare ("sempre passa") — só para localhost/127.0.0.1,
// nunca usada em produção. Evita depender de liberar domínios de dev no Turnstile.
const DEV_TURNSTILE_SITE_KEY="1x00000000000000000000AA";
const _isDevHost=typeof window!=="undefined"&&(["localhost","127.0.0.1"].includes(window.location.hostname)||window.location.protocol==="file:");
const TURNSTILE_SITE_KEY=_isDevHost?DEV_TURNSTILE_SITE_KEY:PROD_TURNSTILE_SITE_KEY;
function LoginScreen({onLoginSuccess}){
  const[email,setEmail]=useState("");
  const[password,setPassword]=useState("");
  const[showPass,setShowPass]=useState(false);
  const[loading,setLoading]=useState(false);
  const[error,setError]=useState("");
  const[captchaToken,setCaptchaToken]=useState("");
  const captchaRef=useRef(null);
  const widgetIdRef=useRef(null);

  useEffect(()=>{
    let cancelled=false;
    let iv=null;
    function renderWidget(){
      if(cancelled||!captchaRef.current||widgetIdRef.current!==null)return;
      try{
        widgetIdRef.current=window.turnstile.render(captchaRef.current,{
          sitekey:TURNSTILE_SITE_KEY,language:"pt-br",theme:"light",
          callback:t=>setCaptchaToken(t),
          "expired-callback":()=>setCaptchaToken(""),
          "error-callback":()=>setCaptchaToken(""),
        });
      }catch(_){}
    }
    if(window.turnstile)renderWidget();
    else iv=setInterval(()=>{if(window.turnstile){clearInterval(iv);iv=null;renderWidget();}},200);
    return()=>{cancelled=true;if(iv)clearInterval(iv);};
  },[]);

  function resetCaptcha(){
    setCaptchaToken("");
    if(window.turnstile&&widgetIdRef.current!==null){try{window.turnstile.reset(widgetIdRef.current);}catch(_){}}
  }

  async function handleLogin(e){
    e.preventDefault();
    if(!email||!password)return;
    if(!captchaToken){setError("Aguarde a verificação de segurança e tente novamente.");return;}
    setLoading(true);setError("");
    const{data,error:err}=await supabase.auth.signInWithPassword({email,password,options:{captchaToken}});
    if(err){
      const msg=/captcha/i.test(err.message||"")
        ?"Falha na verificação de segurança. Tente novamente."
        :"E-mail ou senha inválidos.";
      setError(msg);setLoading(false);resetCaptcha();
    }
    else{await onLoginSuccess(data.session);}
  }

  return(
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",
      background:"#F8FAFC",padding:"24px 20px",position:"relative",overflow:"hidden"}}>
      <div style={{position:"absolute",top:"-15%",left:"50%",transform:"translateX(-50%)",
        width:"120%",maxWidth:900,height:"50%",
        background:"radial-gradient(ellipse, rgba(25,85,255,.10) 0%, transparent 70%)",pointerEvents:"none"}}/>
      <div style={{width:"100%",maxWidth:400,position:"relative",background:"#fff",
        borderRadius:20,border:"1px solid #F1F5F9",boxShadow:"0 12px 48px rgba(15,23,42,.08)",padding:"40px 32px"}}>
        <div style={{display:"flex",justifyContent:"center",marginBottom:32}}>
          <Logo color="#0A0A0B" height={18}/>
        </div>
        <div style={{width:"100%",maxWidth:380,margin:"0 auto"}}>
          <div style={{marginBottom:32,textAlign:"center"}}>
            <div style={{display:"inline-flex",alignItems:"center",gap:6,padding:"4px 10px",
              borderRadius:99,background:`${BLUE}10`,border:`1px solid ${BLUE}22`,marginBottom:18}}>
              <Wrench size={11} color={BLUE}/>
              <span style={{fontSize:11,fontWeight:700,color:BLUE,letterSpacing:".5px",textTransform:"uppercase"}}>
                Controle de Ferramentaria
              </span>
            </div>
            <h1 style={{fontSize:28,fontWeight:800,color:"#111827",letterSpacing:"-.5px",margin:"0 0 10px",lineHeight:1.2}}>
              Bem-vindo
            </h1>
            <p style={{fontSize:14,color:"#6B7280",margin:0,lineHeight:1.6}}>
              Acesse com as credenciais fornecidas pelo administrador do sistema.
            </p>
          </div>
          <ErrorBox>{error}</ErrorBox>
          <form onSubmit={handleLogin} style={{display:"flex",flexDirection:"column",gap:16}}>
            <div>
              <label style={{fontSize:12,fontWeight:700,color:"#374151",display:"block",marginBottom:6,letterSpacing:".3px"}}>
                E-mail corporativo
              </label>
              <div style={{position:"relative"}}>
                <Mail size={15} color="#9CA3AF" style={{position:"absolute",left:13,top:"50%",transform:"translateY(-50%)",pointerEvents:"none"}}/>
                <input type="email" required value={email} onChange={e=>setEmail(e.target.value)}
                  style={{...inputStyle,padding:"12px 14px",paddingLeft:40}} placeholder="nome@deva.com.br"/>
              </div>
            </div>
            <div>
              <label style={{fontSize:12,fontWeight:700,color:"#374151",display:"block",marginBottom:6,letterSpacing:".3px"}}>
                Senha
              </label>
              <div style={{position:"relative"}}>
                <Lock size={15} color="#9CA3AF" style={{position:"absolute",left:13,top:"50%",transform:"translateY(-50%)",pointerEvents:"none"}}/>
                <input type={showPass?"text":"password"} required value={password} onChange={e=>setPassword(e.target.value)}
                  style={{...inputStyle,padding:"12px 14px",paddingLeft:40,paddingRight:46}} placeholder="••••••••"/>
                <button type="button" onClick={()=>setShowPass(v=>!v)} tabIndex={-1}
                  style={{position:"absolute",right:13,top:"50%",transform:"translateY(-50%)",border:"none",
                    background:"none",cursor:"pointer",padding:0,color:"#9CA3AF",display:"flex",alignItems:"center"}}>
                  {showPass?<EyeOff size={15}/>:<EyeIcon size={15}/>}
                </button>
              </div>
            </div>
            <div ref={captchaRef} style={{display:"flex",justifyContent:"center",minHeight:0}}/>
            <button type="submit" disabled={loading} className="btnblue"
              style={{marginTop:4,padding:"14px 0",borderRadius:10,border:"none",background:BLUE,color:"#fff",
                fontWeight:700,fontSize:15,cursor:loading?"not-allowed":"pointer",display:"flex",alignItems:"center",
                justifyContent:"center",gap:8,boxShadow:"0 4px 18px rgba(25,85,255,.35)",opacity:loading?.75:1,letterSpacing:".2px"}}>
              {loading?<><Spinner size={16} color="#fff"/>Entrando...</>:"Entrar"}
            </button>
          </form>
          <div style={{marginTop:28,padding:"13px 16px",borderRadius:10,background:"#F9FAFB",border:"1px solid #F1F5F9",textAlign:"center"}}>
            <p style={{fontSize:12,color:"#9CA3AF",margin:0,lineHeight:1.5}}>
              Problemas de acesso? Entre em contato com{" "}
              <a href="mailto:bruno.cesar@deva.com.br" style={{color:BLUE,fontWeight:600,textDecoration:"none"}}>
                bruno.cesar@deva.com.br
              </a>
            </p>
          </div>
        </div>
      </div>
    </div>
  );
}

function ResetPasswordScreen(){
  const[password,setPassword]=useState("");
  const[confirm,setConfirm]=useState("");
  const[showPass,setShowPass]=useState(false);
  const[showConfirm,setShowConfirm]=useState(false);
  const[loading,setLoading]=useState(false);
  const[error,setError]=useState("");
  const[done,setDone]=useState(false);

  async function handleSubmit(e){
    e.preventDefault();
    if(password.length<8){setError("A senha deve ter pelo menos 8 caracteres.");return;}
    if(password!==confirm){setError("As senhas não coincidem.");return;}
    setLoading(true);setError("");
    const{data:res,error:fnErr}=await supabase.functions.invoke("send-email",{
      body:{emailType:"reset_password_verify",token:_RESET_TOKEN,newPassword:password},
    });
    setLoading(false);
    if(fnErr||!res?.ok){setError(res?.error||"Não foi possível redefinir a senha. O link pode ter expirado.");return;}
    setDone(true);
  }

  return(
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"#F8FAFC",padding:"24px 20px"}}>
      <div style={{width:"100%",maxWidth:400,background:"#fff",borderRadius:20,border:"1px solid #F1F5F9",
        boxShadow:"0 12px 48px rgba(15,23,42,.08)",padding:"40px 32px"}}>
        <div style={{display:"flex",justifyContent:"center",marginBottom:28}}><Logo color="#0A0A0B" height={18}/></div>
        {done?(
          <div style={{textAlign:"center"}}>
            <div style={{width:52,height:52,borderRadius:14,background:"#ECFDF5",display:"flex",alignItems:"center",
              justifyContent:"center",margin:"0 auto 18px"}}><Check size={24} color="#059669"/></div>
            <h2 style={{fontSize:18,fontWeight:800,color:"#111827",margin:"0 0 8px"}}>Senha redefinida!</h2>
            <p style={{fontSize:13,color:"#6B7280",margin:"0 0 24px",lineHeight:1.6}}>Já pode acessar o sistema com sua nova senha.</p>
            <BtnPrimary onClick={()=>{window.location.href=window.location.origin+window.location.pathname;}}>
              Ir para o login
            </BtnPrimary>
          </div>
        ):(
          <>
            <h1 style={{fontSize:22,fontWeight:800,color:"#111827",margin:"0 0 8px",textAlign:"center"}}>Nova senha</h1>
            <p style={{fontSize:13,color:"#6B7280",margin:"0 0 24px",textAlign:"center",lineHeight:1.6}}>
              Defina uma nova senha para acessar o sistema.
            </p>
            <ErrorBox>{error}</ErrorBox>
            <form onSubmit={handleSubmit} style={{display:"flex",flexDirection:"column",gap:16}}>
              <Field label="Nova senha" required>
                <div style={{position:"relative"}}>
                  <input type={showPass?"text":"password"} required value={password} onChange={e=>setPassword(e.target.value)}
                    style={{...inputStyle,paddingRight:44}} placeholder="Mínimo 8 caracteres"/>
                  <button type="button" tabIndex={-1} onClick={()=>setShowPass(v=>!v)}
                    style={{position:"absolute",right:12,top:"50%",transform:"translateY(-50%)",border:"none",
                      background:"none",cursor:"pointer",padding:0,color:"#9CA3AF"}}>
                    {showPass?<EyeOff size={15}/>:<EyeIcon size={15}/>}
                  </button>
                </div>
              </Field>
              <Field label="Confirmar nova senha" required>
                <div style={{position:"relative"}}>
                  <input type={showConfirm?"text":"password"} required value={confirm} onChange={e=>setConfirm(e.target.value)}
                    style={{...inputStyle,paddingRight:44}} placeholder="Repita a senha"/>
                  <button type="button" tabIndex={-1} onClick={()=>setShowConfirm(v=>!v)}
                    style={{position:"absolute",right:12,top:"50%",transform:"translateY(-50%)",border:"none",
                      background:"none",cursor:"pointer",padding:0,color:"#9CA3AF"}}>
                    {showConfirm?<EyeOff size={15}/>:<EyeIcon size={15}/>}
                  </button>
                </div>
              </Field>
              <BtnPrimary type="submit" loading={loading} disabled={loading}>
                {loading?"Salvando...":"Salvar nova senha"}
              </BtnPrimary>
            </form>
          </>
        )}
      </div>
    </div>
  );
}

function NotificationPanel({notifications,onMarkRead,onMarkAllRead,onClose,flip}){
  const unread=notifications.filter(n=>!n.is_read).length;
  return(
    <div className="up" style={{width:320,maxHeight:420,background:"#fff",borderRadius:16,
      boxShadow:"0 16px 48px rgba(0,0,0,.18)",border:"1px solid #F1F5F9",display:"flex",flexDirection:"column",overflow:"hidden"}}>
      <div style={{padding:"14px 16px",borderBottom:"1px solid #F1F5F9",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <span style={{fontSize:13,fontWeight:800,color:"#111827"}}>Notificações</span>
        {unread>0&&<button onClick={onMarkAllRead} style={{border:"none",background:"none",color:BLUE,fontSize:11,fontWeight:700,cursor:"pointer"}}>
          Marcar todas como lidas
        </button>}
      </div>
      <div style={{overflowY:"auto",flex:1}}>
        {notifications.length===0?(
          <div style={{padding:"40px 20px",textAlign:"center",color:"#9CA3AF",fontSize:13}}>Nenhuma notificação</div>
        ):notifications.map(n=>(
          <button key={n.id} onClick={()=>onMarkRead(n.id)}
            style={{width:"100%",textAlign:"left",padding:"12px 16px",border:"none",borderBottom:"1px solid #F8FAFC",
              background:n.is_read?"#fff":"#F5F8FF",cursor:"pointer"}}>

function UserFooterMenu({currentUser,collapsed,onViewProfile,onLogout}){
  const[open,setOpen]=useState(false);
  const[pos,setPos]=useState({left:0,bottom:0});
  const wrapRef=useRef(null);
  const popRef=useRef(null);
  useEffect(()=>{
    if(!open)return;
    function onDoc(e){
      if(popRef.current&&popRef.current.contains(e.target))return;
      if(wrapRef.current&&wrapRef.current.contains(e.target))return;
      setOpen(false);
    }
    document.addEventListener("mousedown",onDoc);
    return()=>document.removeEventListener("mousedown",onDoc);
  },[open]);

  // Posição calculada em pixels de tela (não relativa ao menu lateral) — o pop-up é
  // renderizado via Portal direto no <body>, então não fica cortado pelo overflow:hidden
  // do <aside> quando o menu está recolhido ou a lista é maior que a área visível.
  function toggle(){
    if(!open&&wrapRef.current){
      const r=wrapRef.current.getBoundingClientRect();
      setPos({left:r.left+8,bottom:window.innerHeight-r.top+8});
    }
    setOpen(v=>!v);
  }

  return(
    <div ref={wrapRef} style={{padding:8,borderTop:"1px solid rgba(255,255,255,.07)",position:"relative"}}>
      <button onClick={toggle}
        style={{width:"100%",display:"flex",alignItems:"center",gap:10,padding:"8px",borderRadius:9,
          border:"none",background:open?"#18181B":"transparent",cursor:"pointer",textAlign:"left"}}>
        <div style={{width:30,height:30,borderRadius:"50%",background:currentUser.color||BLUE,flexShrink:0,
          display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:800,color:"#fff"}}>
          {getInitials(currentUser.name)}
        </div>
        {!collapsed&&(
          <div style={{minWidth:0,flex:1,opacity:0,animation:"fadeIn .22s ease .08s forwards"}}>
            <div style={{fontSize:12.5,fontWeight:700,color:"#fff",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{currentUser.name}</div>
            <div style={{fontSize:10.5,color:"#71717A",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{currentUser.filialNome||"Todas as filiais"}</div>
          </div>
        )}
      </button>
      {open&&createPortal(
        <div ref={popRef} className="up" style={{position:"fixed",left:pos.left,bottom:pos.bottom,width:220,background:"#18181B",
          borderRadius:12,border:"1px solid rgba(255,255,255,.08)",boxShadow:"0 16px 40px rgba(0,0,0,.4)",
          padding:6,zIndex:1200}}>
          <button onClick={()=>{onViewProfile();setOpen(false);}}
            style={{width:"100%",display:"flex",alignItems:"center",gap:10,padding:"9px 12px",borderRadius:8,
              border:"none",background:"transparent",cursor:"pointer",textAlign:"left",color:"#D4D4D8",fontSize:13,fontWeight:500}}
            onMouseEnter={e=>{e.currentTarget.style.background="#27272A";}}
            onMouseLeave={e=>{e.currentTarget.style.background="transparent";}}>
            <UserCheck size={14}/>Meu Perfil
          </button>
          <button onClick={onLogout}
            style={{width:"100%",display:"flex",alignItems:"center",gap:10,padding:"9px 12px",borderRadius:8,
              border:"none",background:"transparent",cursor:"pointer",textAlign:"left",color:"#D4D4D8",fontSize:13,fontWeight:500}}
            onMouseEnter={e=>{e.currentTarget.style.background="#27272A";e.currentTarget.style.color="#FCA5A5";}}
            onMouseLeave={e=>{e.currentTarget.style.background="transparent";e.currentTarget.style.color="#D4D4D8";}}>
            <LogOut size={14}/>Sair
          </button>
        </div>,
        document.body
      )}
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════
   DASHBOARD
   ══════════════════════════════════════════════════════════════ */
function DashboardView({profile,filiais}){
  const[stats,setStats]=useState(null);
  const[loading,setLoading]=useState(true);

  useEffect(()=>{
    let cancelled=false;
    async function load(){
      setLoading(true);
      let q=supabase.from("ferramentas").select("status,data_proxima_afericao,ativo");
      if(profile.userType!=="admin_geral")q=q.eq("filial_id",profile.filialId);
      const{data,error}=await q;
      if(cancelled)return;
      if(!error&&data){
        const s={total:data.length,disponivel:0,com_colaborador:0,em_afericao:0,em_conserto:0,extraviada:0,baixada:0,vencidas:0,proximas:0};
        const hoje=new Date();hoje.setHours(0,0,0,0);
        data.forEach(f=>{
          s[f.status]=(s[f.status]||0)+1;
          if(f.ativo&&f.data_proxima_afericao&&f.status!=="em_afericao"){
            const d=new Date(f.data_proxima_afericao);
            if(d<hoje)s.vencidas++;
            else if(diasEntre(hoje,d)<=7)s.proximas++;
          }
        });
        setStats(s);
      }
      setLoading(false);
    }
    load();
    return()=>{cancelled=true;};
  },[profile.filialId,profile.userType]);

  if(loading)return <div style={{padding:60,textAlign:"center"}}><Spinner size={22}/></div>;
  if(!stats)return null;

  return(
    <div className="fade" style={{padding:"28px 32px"}}>
      <h1 style={{fontSize:22,fontWeight:800,color:"#111827",margin:"0 0 4px"}}>Dashboard</h1>
      <p style={{fontSize:13,color:"#6B7280",margin:"0 0 24px"}}>
        Visão geral {profile.userType==="admin_geral"?"de todas as filiais":`da filial ${profile.filialNome}`}.
      </p>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(200px,1fr))",gap:14,marginBottom:14}}>
        <StatCard label="Total de Ferramentas" value={stats.total} Icon={Wrench} color={BLUE}/>
        <StatCard label="Disponíveis" value={stats.disponivel||0} Icon={PackageCheck} color="#059669"/>
        <StatCard label="Com Colaborador" value={stats.com_colaborador||0} Icon={Users} color={BLUE}/>
        <StatCard label="Em Aferição" value={stats.em_afericao||0} Icon={Clock} color="#D97706"/>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(200px,1fr))",gap:14}}>
        <StatCard label="Em Conserto" value={stats.em_conserto||0} Icon={PackageX} color="#DB2777"/>
        <StatCard label="Extraviadas" value={stats.extraviada||0} Icon={AlertTriangle} color="#B91C1C"/>
        <StatCard label="Aferições Vencidas" value={stats.vencidas} Icon={AlertCircle} color="#B91C1C"/>
        <StatCard label="Aferições Próx. 7 dias" value={stats.proximas} Icon={Calendar} color="#D97706"/>
      </div>
    </div>
  );
}

function ModalNovaFerramenta({onClose,onSaved,filiais,profile,editando}){
  const[codigo,setCodigo]=useState(editando?.codigo||"");
  const[nome,setNome]=useState(editando?.nome||"");
  const[categoria,setCategoria]=useState(editando?.categoria||"");
  const[filialId,setFilialId]=useState(editando?.filial_id||(profile.userType==="admin_area"?profile.filialId:""));
  const[dataProximaAfericao,setDataProximaAfericao]=useState(editando?.data_proxima_afericao||"");
  const[observacoes,setObservacoes]=useState(editando?.observacoes||"");
  const[loading,setLoading]=useState(false);
  const[error,setError]=useState("");

  async function salvar(){
    if(!codigo||!nome||!filialId){setError("Preencha código, nome e filial.");return;}
    setLoading(true);setError("");
    if(editando){
      const{error:err}=await supabase.from("ferramentas").update({codigo,nome,categoria:categoria||null,observacoes:observacoes||null}).eq("id",editando.id);
      setLoading(false);
      if(err){setError(traduzErro(err));return;}
    }else{
      const{error:err}=await supabase.from("ferramentas").insert({
        codigo,nome,categoria:categoria||null,filial_id:filialId,
        data_proxima_afericao:dataProximaAfericao||null,observacoes:observacoes||null,
      });
      setLoading(false);
      if(err){setError(traduzErro(err));return;}
    }
    onSaved();
  }

  return(
    <Modal title={editando?"Editar Ferramenta":"Nova Ferramenta"} onClose={onClose}
      footer={<>
        <BtnSecondary onClick={onClose}>Cancelar</BtnSecondary>
        <BtnPrimary onClick={salvar} loading={loading}>{editando?"Salvar Alterações":"Cadastrar Ferramenta"}</BtnPrimary>
      </>}>
      <ErrorBox>{error}</ErrorBox>
      <div style={{display:"flex",flexDirection:"column",gap:14}}>
        <Field label="Código de identificação" required>
          <input value={codigo} onChange={e=>setCodigo(e.target.value)} style={inputStyle} placeholder="Ex.: FER-0123"/>
        </Field>
        <Field label="Nome da ferramenta" required>
          <input value={nome} onChange={e=>setNome(e.target.value)} style={inputStyle} placeholder="Ex.: Torquímetro 1/2&quot;"/>
        </Field>
        <Field label="Categoria">
          <input value={categoria} onChange={e=>setCategoria(e.target.value)} style={inputStyle} placeholder="Ex.: Ferramenta de medição"/>
        </Field>
        <Field label="Filial" required>
          <select value={filialId} onChange={e=>setFilialId(e.target.value)} style={inputStyle}
            disabled={!!editando||profile.userType==="admin_area"}>
            <option value="">Selecione...</option>
            {filiais.map(f=><option key={f.id} value={f.id}>{f.nome}</option>)}
          </select>
        </Field>
        {!editando&&<Field label="Próxima aferição programada" hint="Deixe em branco se a ferramenta não exige aferição.">
          <input type="date" value={dataProximaAfericao} onChange={e=>setDataProximaAfericao(e.target.value)} style={inputStyle}/>
        </Field>}
        <Field label="Observações">
          <textarea value={observacoes} onChange={e=>setObservacoes(e.target.value)} style={{...inputStyle,minHeight:70,resize:"vertical"}}/>
        </Field>
      </div>
    </Modal>
  );
}

function traduzErro(err){
  const m=err?.message||"";
  if(/duplicate key/i.test(m))return "Já existe uma ferramenta com esse código nessa filial.";
  return m||"Ocorreu um erro. Tente novamente.";
}

function ModalAcao({ferramenta,tipo,onClose,onDone,pessoasFilial}){
  const[pessoaId,setPessoaId]=useState("");
  const[observacao,setObservacao]=useState("");
  const[loading,setLoading]=useState(false);
  const[error,setError]=useState("");

  const CONFIG={
    retirada:{title:"Registrar Retirada",needsPessoa:true,confirmLabel:"Confirmar Retirada"},
    devolucao:{title:"Registrar Devolução",needsPessoa:false,confirmLabel:"Confirmar Devolução"},
    envio_afericao:{title:"Enviar para Aferição",needsPessoa:false,confirmLabel:"Confirmar Envio"},
    retorno_afericao:{title:"Registrar Retorno da Aferição",needsPessoa:false,confirmLabel:"Confirmar Retorno"},
    extravio:{title:"Reportar Extravio",needsPessoa:false,confirmLabel:"Reportar Extravio",danger:true},
    baixa:{title:"Dar Baixa na Ferramenta",needsPessoa:false,confirmLabel:"Confirmar Baixa",danger:true},
    reativacao:{title:"Reativar Ferramenta",needsPessoa:false,confirmLabel:"Reativar"},
  }[tipo];

  async function confirmar(){
    if(CONFIG.needsPessoa&&!pessoaId){setError("Selecione com quem a ferramenta vai ficar.");return;}
    setLoading(true);setError("");
    const{error:err}=await supabase.from("movimentacoes").insert({
      ferramenta_id:ferramenta.id,tipo,
      pessoa_responsavel_id:CONFIG.needsPessoa?pessoaId:null,
      observacao:observacao||null,
    });
    setLoading(false);
    if(err){setError(err.message||"Não foi possível registrar. Tente novamente.");return;}
    onDone();
  }

  return(
    <Modal title={CONFIG.title} onClose={onClose}
      footer={<>
        <BtnSecondary onClick={onClose}>Cancelar</BtnSecondary>
        <BtnPrimary onClick={confirmar} loading={loading} danger={CONFIG.danger}>{CONFIG.confirmLabel}</BtnPrimary>
      </>}>
      <ErrorBox>{error}</ErrorBox>
      <div style={{marginBottom:16,padding:12,borderRadius:10,background:"#F9FAFB",border:"1px solid #F1F5F9"}}>
        <div style={{fontSize:11,color:"#9CA3AF",fontWeight:700,textTransform:"uppercase",marginBottom:2}}>{ferramenta.codigo}</div>
        <div style={{fontSize:14,fontWeight:700,color:"#111827"}}>{ferramenta.nome}</div>
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:14}}>
        {CONFIG.needsPessoa&&(
          <Field label="Com quem a ferramenta vai ficar" required>
            <select value={pessoaId} onChange={e=>setPessoaId(e.target.value)} style={inputStyle}>
              <option value="">Selecione...</option>
              {pessoasFilial.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
            </select>
          </Field>
        )}
        <Field label="Observação (opcional)">
          <textarea value={observacao} onChange={e=>setObservacao(e.target.value)} style={{...inputStyle,minHeight:70,resize:"vertical"}}/>
        </Field>
      </div>
    </Modal>
  );
}

function FerramentasView({profile,filiais,pessoas}){
  const isMobile=useIsMobile();
  const[ferramentas,setFerramentas]=useState([]);
  const[loading,setLoading]=useState(true);
  const[busca,setBusca]=useState("");
  const[filtroStatus,setFiltroStatus]=useState("");
  const[filtroFilial,setFiltroFilial]=useState(profile.userType==="admin_geral"?"":profile.filialId);
  const[selecionada,setSelecionada]=useState(null);
  const[novaAberta,setNovaAberta]=useState(false);
  const isAdmin=profile.userType==="admin_geral"||profile.userType==="admin_area";

  async function load(){
    setLoading(true);
    let q=supabase.from("ferramentas").select("*, colaborador_atual:colaborador_atual_id(name)").order("codigo");
    if(profile.userType!=="admin_geral")q=q.eq("filial_id",profile.filialId);
    else if(filtroFilial)q=q.eq("filial_id",filtroFilial);
    if(filtroStatus)q=q.eq("status",filtroStatus);
    const{data,error}=await q;
    if(!error)setFerramentas(data||[]);
    setLoading(false);
  }
  useEffect(()=>{load();},[filtroStatus,filtroFilial,profile.filialId]);

  const filtradas=useMemo(()=>{
    const t=busca.trim().toLowerCase();
    if(!t)return ferramentas;
    return ferramentas.filter(f=>f.codigo.toLowerCase().includes(t)||f.nome.toLowerCase().includes(t));
  },[ferramentas,busca]);

  const pessoasFilial=useMemo(()=>{
    const fid=selecionada?.filial_id;
    return pessoas.filter(p=>p.filial_id===fid);
  },[pessoas,selecionada]);

  return(
    <div className="fade" style={{padding:isMobile?"20px 16px":"28px 32px"}}>

        <div>
          <h1 style={{fontSize:22,fontWeight:800,color:"#111827",margin:"0 0 4px"}}>Ferramentas</h1>
          <p style={{fontSize:13,color:"#6B7280",margin:0}}>{filtradas.length} ferramenta(s)</p>
        </div>
        {isAdmin&&<BtnPrimary onClick={()=>setNovaAberta(true)}><Plus size={15}/>Nova Ferramenta</BtnPrimary>}
      </div>

      <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:18}}>
        <div style={{position:"relative",flex:"1 1 220px"}}>
          <Search size={14} color="#9CA3AF" style={{position:"absolute",left:12,top:"50%",transform:"translateY(-50%)"}}/>
          <input value={busca} onChange={e=>setBusca(e.target.value)} placeholder="Buscar por código ou nome..."
            style={{...inputStyle,paddingLeft:34}}/>
        </div>
        <select value={filtroStatus} onChange={e=>setFiltroStatus(e.target.value)} style={{...inputStyle,width:"auto"}}>
          <option value="">Todos os status</option>
          {Object.entries(STATUS_FERRAMENTA_INFO).map(([k,v])=><option key={k} value={k}>{v.label}</option>)}
        </select>
        {profile.userType==="admin_geral"&&(
          <select value={filtroFilial} onChange={e=>setFiltroFilial(e.target.value)} style={{...inputStyle,width:"auto"}}>
            <option value="">Todas as filiais</option>
            {filiais.map(f=><option key={f.id} value={f.id}>{f.nome}</option>)}
          </select>
        )}
      </div>

      {loading?<div style={{padding:60,textAlign:"center"}}><Spinner size={20}/></div>:
      filtradas.length===0?<EmptyState icon={Wrench} title="Nenhuma ferramenta encontrada" text="Ajuste os filtros ou cadastre uma nova ferramenta."/>:
      isMobile?(
        <div style={{display:"flex",flexDirection:"column",gap:10}}>
          {filtradas.map(f=>(
            <button key={f.id} onClick={()=>setSelecionada(f)} className="lift"
              style={{textAlign:"left",background:"#fff",border:"1px solid #F1F5F9",borderRadius:14,padding:14,cursor:"pointer"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8}}>
                <div>
                  <div style={{fontSize:11,color:"#9CA3AF",fontWeight:700}}>{f.codigo}</div>
                  <div style={{fontSize:14,fontWeight:700,color:"#111827"}}>{f.nome}</div>
                </div>
                <StatusBadge status={f.status}/>
              </div>
              {f.colaborador_atual?.name&&<div style={{fontSize:12,color:"#6B7280",marginTop:6}}>Com: {f.colaborador_atual.name}</div>}
            </button>
          ))}

      ):(
        <div style={{background:"#fff",border:"1px solid #F1F5F9",borderRadius:16,overflow:"hidden"}}>
          <table style={{width:"100%",borderCollapse:"collapse"}}>
            <thead>
              <tr style={{background:"#F9FAFB"}}>
                {["Código","Nome","Status","Com quem está","Próx. Aferição",""].map(h=>(
                  <th key={h} style={{padding:"10px 16px",textAlign:"left",fontSize:11,fontWeight:700,color:"#6B7280",textTransform:"uppercase"}}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {filtradas.map(f=>(
                <tr key={f.id} className="row-hover" onClick={()=>setSelecionada(f)}
                  style={{borderTop:"1px solid #F1F5F9",cursor:"pointer"}}>
                  <td style={{padding:"12px 16px",fontSize:13,fontWeight:700,color:"#111827"}}>{f.codigo}</td>
                  <td style={{padding:"12px 16px",fontSize:13,color:"#374151"}}>{f.nome}</td>
                  <td style={{padding:"12px 16px"}}><StatusBadge status={f.status}/></td>
                  <td style={{padding:"12px 16px",fontSize:13,color:"#374151"}}>{f.colaborador_atual?.name||"—"}</td>
                  <td style={{padding:"12px 16px",fontSize:13,color:"#374151"}}>{fmtDate(f.data_proxima_afericao)}</td>
                  <td style={{padding:"12px 16px"}}><ChevronRight size={15} color="#9CA3AF"/></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}

      {selecionada&&<FerramentaDetalheModal ferramenta={selecionada} profile={profile} filiais={filiais}
        pessoasFilial={pessoasFilial}
        onClose={()=>setSelecionada(null)}
        onChanged={()=>{load();
          supabase.from("ferramentas").select("*, colaborador_atual:colaborador_atual_id(name)").eq("id",selecionada.id).single()
            .then(({data})=>{if(data)setSelecionada(data);});
        }}/>}
      {novaAberta&&<ModalNovaFerramenta filiais={filiais} profile={profile}
        onClose={()=>setNovaAberta(false)} onSaved={()=>{setNovaAberta(false);load();}}/>}
    </div>
  );
}

function MovimentacoesView({profile,filiais}){
  const isMobile=useIsMobile();
  const[lista,setLista]=useState([]);
  const[loading,setLoading]=useState(true);
  const[filtroTipo,setFiltroTipo]=useState("");

  async function load(){
    setLoading(true);
    let q=supabase.from("movimentacoes")
      .select("*, ferramenta:ferramenta_id(codigo,nome,filial_id), registrado_por_profile:registrado_por(name), pessoa_responsavel:pessoa_responsavel_id(name)")
      .order("data",{ascending:false}).limit(200);
    if(filtroTipo)q=q.eq("tipo",filtroTipo);
    const{data,error}=await q;
    if(!error){
      const filtradas=profile.userType==="admin_geral"?data:(data||[]).filter(m=>m.ferramenta?.filial_id===profile.filialId);
      setLista(filtradas||[]);
    }
    setLoading(false);
  }
  useEffect(()=>{load();},[filtroTipo,profile.filialId]);

  function exportar(){
    const rows=lista.map(m=>({
      Data:fmtDateTime(m.data),Tipo:TIPO_MOV_LABEL[m.tipo]||m.tipo,
      Ferramenta:`${m.ferramenta?.codigo||""} - ${m.ferramenta?.nome||""}`,
      "Responsável":m.pessoa_responsavel?.name||"",
      "Registrado por":m.registrado_por_profile?.name||"",
      Observação:m.observacao||"",
    }));
    const ws=XLSX.utils.json_to_sheet(rows);
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,"Movimentações");
    XLSX.writeFile(wb,"movimentacoes_ferramentaria.xlsx");
  }

  return(
    <div className="fade" style={{padding:isMobile?"20px 16px":"28px 32px"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:20,flexWrap:"wrap",gap:12}}>
        <div>
          <h1 style={{fontSize:22,fontWeight:800,color:"#111827",margin:"0 0 4px"}}>Movimentações</h1>
          <p style={{fontSize:13,color:"#6B7280",margin:0}}>Histórico completo de ações — registro imutável.</p>
        </div>
        <BtnSecondary onClick={exportar}><Download size={14}/>Exportar Excel</BtnSecondary>
      </div>
      <select value={filtroTipo} onChange={e=>setFiltroTipo(e.target.value)} style={{...inputStyle,width:"auto",marginBottom:18}}>
        <option value="">Todos os tipos</option>
        {Object.entries(TIPO_MOV_LABEL).map(([k,v])=><option key={k} value={k}>{v}</option>)}
      </select>
      {loading?<div style={{padding:60,textAlign:"center"}}><Spinner size={20}/></div>:
      lista.length===0?<EmptyState icon={ArrowLeftRight} title="Nenhuma movimentação encontrada"/>:(
        <div style={{display:"flex",flexDirection:"column",gap:0,background:"#fff",border:"1px solid #F1F5F9",borderRadius:16,overflow:"hidden"}}>
          {lista.map(m=>(
            <div key={m.id} style={{display:"flex",gap:12,padding:"14px 18px",borderBottom:"1px solid #F8FAFC"}}>
              <History size={16} color="#9CA3AF" style={{marginTop:2,flexShrink:0}}/>
              <div style={{minWidth:0,flex:1}}>
                <div style={{display:"flex",flexWrap:"wrap",gap:8,alignItems:"center"}}>
                  <span style={{fontSize:13,fontWeight:700,color:"#111827"}}>{TIPO_MOV_LABEL[m.tipo]||m.tipo}</span>
                  <span style={{fontSize:12,color:"#6B7280"}}>{m.ferramenta?.codigo} — {m.ferramenta?.nome}</span>
                </div>
                <div style={{fontSize:11.5,color:"#9CA3AF",marginTop:2}}>
                  {fmtDateTime(m.data)} · por {m.registrado_por_profile?.name||"—"}
                  {m.pessoa_responsavel?.name?` · com ${m.pessoa_responsavel.name}`:""}
                </div>
                {m.observacao&&<div style={{fontSize:12.5,color:"#374151",marginTop:4}}>{m.observacao}</div>}
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function ModalEnviarConserto({onClose,onDone,ferramentasDisponiveis}){
  const[ferramentaId,setFerramentaId]=useState("");
  const[motivo,setMotivo]=useState("");
  const[localFornecedor,setLocalFornecedor]=useState("");
  const[dataRetornoPrevista,setDataRetornoPrevista]=useState("");
  const[loading,setLoading]=useState(false);
  const[error,setError]=useState("");

  async function salvar(){
    if(!ferramentaId||!motivo){setError("Selecione a ferramenta e informe o motivo.");return;}
    setLoading(true);setError("");
    const{error:err}=await supabase.from("manutencoes").insert({
      ferramenta_id:ferramentaId,motivo,local_fornecedor:localFornecedor||null,
      data_retorno_prevista:dataRetornoPrevista||null,
    });
    setLoading(false);
    if(err){setError(err.message||"Não foi possível registrar.");return;}
    onDone();
  }
  return(
    <Modal title="Enviar Ferramenta para Conserto" onClose={onClose}
      footer={<><BtnSecondary onClick={onClose}>Cancelar</BtnSecondary>
        <BtnPrimary onClick={salvar} loading={loading}>Confirmar Envio</BtnPrimary></>}>
      <ErrorBox>{error}</ErrorBox>
      <div style={{display:"flex",flexDirection:"column",gap:14}}>
        <Field label="Ferramenta" required>
          <select value={ferramentaId} onChange={e=>setFerramentaId(e.target.value)} style={inputStyle}>
            <option value="">Selecione (só ferramentas disponíveis)...</option>
            {ferramentasDisponiveis.map(f=><option key={f.id} value={f.id}>{f.codigo} — {f.nome}</option>)}
          </select>
        </Field>
        <Field label="Motivo do conserto" required>
          <textarea value={motivo} onChange={e=>setMotivo(e.target.value)} style={{...inputStyle,minHeight:60,resize:"vertical"}} placeholder="Ex.: Não está calibrando corretamente"/>
        </Field>
        <Field label="Local / Fornecedor">
          <input value={localFornecedor} onChange={e=>setLocalFornecedor(e.target.value)} style={inputStyle}/>
        </Field>
        <Field label="Retorno previsto">
          <input type="date" value={dataRetornoPrevista} onChange={e=>setDataRetornoPrevista(e.target.value)} style={inputStyle}/>
        </Field>
      </div>
    </Modal>
  );
}

function ModalRetornoConserto({manutencao,onClose,onDone,isAdmin}){
  const[status,setStatus]=useState("concluido");
  const[observacoes,setObservacoes]=useState("");
  const[loading,setLoading]=useState(false);
  const[error,setError]=useState("");

  async function salvar(){
    setLoading(true);setError("");
    const{error:err}=await supabase.from("manutencoes").update({status,observacoes:observacoes||null}).eq("id",manutencao.id);
    setLoading(false);
    if(err){setError(err.message||"Não foi possível registrar.");return;}
    onDone();
  }
  return(
    <Modal title="Registrar Retorno do Conserto" onClose={onClose}
      footer={<><BtnSecondary onClick={onClose}>Cancelar</BtnSecondary>
        <BtnPrimary onClick={salvar} loading={loading}>Confirmar Retorno</BtnPrimary></>}>
      <ErrorBox>{error}</ErrorBox>
      <div style={{marginBottom:14,padding:12,borderRadius:10,background:"#F9FAFB",border:"1px solid #F1F5F9"}}>
        <div style={{fontSize:11,color:"#9CA3AF",fontWeight:700}}>{manutencao.ferramenta?.codigo}</div>
        <div style={{fontSize:14,fontWeight:700,color:"#111827"}}>{manutencao.ferramenta?.nome}</div>

      <div style={{display:"flex",flexDirection:"column",gap:14}}>
        <Field label="Resultado do conserto" required>
          <div style={{display:"flex",gap:8}}>
            <button type="button" onClick={()=>setStatus("concluido")}
              style={{flex:1,padding:"10px",borderRadius:9,border:`1.5px solid ${status==="concluido"?BLUE:"#E5E7EB"}`,
                background:status==="concluido"?"#EEF2FF":"#fff",color:status==="concluido"?BLUE:"#374151",fontWeight:700,fontSize:13,cursor:"pointer"}}>
              Consertada
            </button>
            {isAdmin&&<button type="button" onClick={()=>setStatus("baixada")}
              style={{flex:1,padding:"10px",borderRadius:9,border:`1.5px solid ${status==="baixada"?"#DC2626":"#E5E7EB"}`,

            </button>}
          </div>
        </Field>
        <Field label="Observações">
          <textarea value={observacoes} onChange={e=>setObservacoes(e.target.value)} style={{...inputStyle,minHeight:60,resize:"vertical"}}/>
        </Field>
      </div>
    </Modal>
  );
}

                </div>

                <div style={{fontSize:11,color:"#9CA3AF",marginTop:2}}>
                  Enviado em {fmtDate(m.data_envio)}{m.local_fornecedor?` · ${m.local_fornecedor}`:""}
                  {m.data_retorno_real?` · Retornou em ${fmtDate(m.data_retorno_real)}`:""}
                </div>
              </div>
              {m.status==="em_conserto"&&<BtnSecondary onClick={()=>setRetornando(m)}>Registrar Retorno</BtnSecondary>}
            </div>
          ))}
        </div>
      )}
      {novoAberto&&<ModalEnviarConserto ferramentasDisponiveis={disponiveis}
        onClose={()=>setNovoAberto(false)} onDone={()=>{setNovoAberto(false);load();}}/>}
      {retornando&&<ModalRetornoConserto manutencao={retornando} isAdmin={isAdmin}
        onClose={()=>setRetornando(null)} onDone={()=>{setRetornando(null);load();}}/>}
    </div>
  );
}

function ModalNovaAuditoria({onClose,onSaved,filiais,profile}){
  const[titulo,setTitulo]=useState("");
  const[filialId,setFilialId]=useState(profile.userType==="admin_area"?profile.filialId:"");
  const[loading,setLoading]=useState(false);
  const[error,setError]=useState("");

  async function salvar(){
    if(!titulo||!filialId){setError("Preencha o título e a filial.");return;}
    setLoading(true);setError("");
    const{data:userData}=await supabase.auth.getUser();
    const{error:err}=await supabase.from("auditorias_ferramentaria").insert({
      titulo,filial_id:filialId,auditor_id:userData.user.id,status:"nao_iniciada",
    });
    setLoading(false);
    if(err){setError(err.message);return;}
    onSaved();
  }
  return(
    <Modal title="Nova Auditoria" onClose={onClose}
      footer={<><BtnSecondary onClick={onClose}>Cancelar</BtnSecondary>
        <BtnPrimary onClick={salvar} loading={loading}>Criar Auditoria</BtnPrimary></>}>

        </Field>
      </div>
    </Modal>
  );
}

function AuditoriaExecucaoView({auditoria,onBack,onChanged}){
  const isMobile=useIsMobile();
  const[itens,setItens]=useState([]);
  const[loading,setLoading]=useState(true);
  const[salvandoId,setSalvandoId]=useState(null);

  async function load(){
    setLoading(true);
    const{data:ferramentas}=await supabase.from("ferramentas").select("id,codigo,nome").eq("filial_id",auditoria.filial_id).eq("ativo",true).order("codigo");
    const{data:existentes}=await supabase.from("auditoria_itens").select("*").eq("auditoria_id",auditoria.id);
    const map=new Map((existentes||[]).map(i=>[i.ferramenta_id,i]));
    setItens((ferramentas||[]).map(f=>({
      ferramenta_id:f.id,codigo:f.codigo,nome:f.nome,
      resultado:map.get(f.id)?.resultado||null,observacao:map.get(f.id)?.observacao||"",
    })));
    setLoading(false);
  }
  useEffect(()=>{load();},[auditoria.id]);

  async function marcar(item,resultado){
    setSalvandoId(item.ferramenta_id);
    await supabase.from("auditoria_itens").upsert({
      auditoria_id:auditoria.id,ferramenta_id:item.ferramenta_id,
      ferramenta_codigo:item.codigo,ferramenta_nome:item.nome,resultado,
    },{onConflict:"auditoria_id,ferramenta_id"});
    if(auditoria.status==="nao_iniciada"){
      await supabase.from("auditorias_ferramentaria").update({status:"em_andamento",data_inicio:new Date().toISOString()}).eq("id",auditoria.id);
    }
    setItens(prev=>prev.map(i=>i.ferramenta_id===item.ferramenta_id?{...i,resultado}:i));
    setSalvandoId(null);
  }

  const total=itens.length;
  const avaliados=itens.filter(i=>i.resultado).length;
  const naoEncontradas=itens.filter(i=>i.resultado==="nao_encontrada").length;
  const danificadas=itens.filter(i=>i.resultado==="danificada").length;

  async function finalizar(){
    await supabase.from("auditorias_ferramentaria").update({status:"concluida",data_conclusao:new Date().toISOString()}).eq("id",auditoria.id);
    onChanged();
    onBack();
  }

  return(
    <div className="fade" style={{padding:isMobile?"20px 16px":"28px 32px"}}>
      <button onClick={onBack} style={{display:"flex",alignItems:"center",gap:6,border:"none",background:"none",
        color:"#6B7280",fontSize:13,fontWeight:600,cursor:"pointer",padding:0,marginBottom:16}}>
        <ArrowLeft size={14}/>Voltar para Auditorias
      </button>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:12,marginBottom:20}}>
        <div>
          <h1 style={{fontSize:20,fontWeight:800,color:"#111827",margin:"0 0 4px"}}>{auditoria.titulo}</h1>
          <p style={{fontSize:13,color:"#6B7280",margin:0}}>{avaliados}/{total} ferramentas avaliadas
            {naoEncontradas>0&&<span style={{color:"#B91C1C",fontWeight:700}}> · {naoEncontradas} não encontrada(s)</span>}
            {danificadas>0&&<span style={{color:"#D97706",fontWeight:700}}> · {danificadas} danificada(s)</span>}
          </p>
        </div>
        {avaliados===total&&total>0&&auditoria.status!=="concluida"&&(
          <BtnPrimary onClick={finalizar}><CheckCircle2 size={15}/>Finalizar Auditoria</BtnPrimary>
        )}
      </div>
      <div style={{height:6,background:"#F1F5F9",borderRadius:99,marginBottom:20,overflow:"hidden"}}>
        <div style={{height:"100%",width:`${total?(avaliados/total)*100:0}%`,background:BLUE,transition:"width .3s"}}/>
      </div>
      {loading?<div style={{padding:60,textAlign:"center"}}><Spinner size={20}/></div>:(
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          {itens.map(item=>{
            const info=item.resultado?RESULTADO_ITEM_INFO[item.resultado]:null;
            return(
              <div key={item.ferramenta_id} style={{background:"#fff",border:`1.5px solid ${info?info.color+"33":"#F1F5F9"}`,
                borderRadius:12,padding:"12px 14px",display:"flex",alignItems:"center",justifyContent:"space-between",gap:10,flexWrap:"wrap"}}>
                <div>
                  <span style={{fontSize:11,color:"#9CA3AF",fontWeight:700}}>{item.codigo}</span>{" "}
                  <span style={{fontSize:13.5,fontWeight:700,color:"#111827"}}>{item.nome}</span>
                </div>
                <div style={{display:"flex",gap:6}}>
                  {salvandoId===item.ferramenta_id?<Spinner size={14}/>:
                  ["encontrada","nao_encontrada","danificada"].map(r=>{
                    const i=RESULTADO_ITEM_INFO[r];
                    const active=item.resultado===r;
                    return(
                      <button key={r} onClick={()=>marcar(item,r)}
                        style={{padding:"6px 11px",borderRadius:8,border:`1.5px solid ${active?i.color:"#E5E7EB"}`,
                          background:active?i.bg:"#fff",color:active?i.color:"#9CA3AF",fontSize:11.5,fontWeight:700,cursor:"pointer"}}>
                        {i.label}
                      </button>
                    );
                  })}
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function ModalUsuario({onClose,onSaved,filiais,profile,editando}){
  const[name,setName]=useState(editando?.name||"");
  const[email,setEmail]=useState(editando?.email||"");
  const[userType,setUserType]=useState(editando?.user_type||"colaborador");
  const[filialId,setFilialId]=useState(editando?.filial_id||(profile.userType==="admin_area"?profile.filialId:""));
  const[loading,setLoading]=useState(false);
  const[error,setError]=useState("");
  const[resultado,setResultado]=useState(null);

  async function salvar(){
    if(!name||!email){setError("Preencha nome e e-mail.");return;}
    if(userType!=="admin_geral"&&!filialId){setError("Selecione a filial.");return;}
    setLoading(true);setError("");
    const{data:sess}=await supabase.auth.getSession();
    const token=sess.session.access_token;
    if(editando){
      const resp=await fetch(`${SUPA_URL}/functions/v1/admin-update-user`,{
        method:"POST",headers:{"Content-Type":"application/json",Authorization:`Bearer ${token}`},
        body:JSON.stringify({user_id:editando.id,action:"update_profile",name,user_type:userType,filial_id:userType==="admin_geral"?null:filialId}),
      });
      const json=await resp.json();
      setLoading(false);
      if(!json.ok){setError(json.error);return;}
      onSaved();
    }else{
      const resp=await fetch(`${SUPA_URL}/functions/v1/admin-create-user`,{
        method:"POST",headers:{"Content-Type":"application/json",Authorization:`Bearer ${token}`},
        body:JSON.stringify({name,email,user_type:userType,filial_id:userType==="admin_geral"?null:filialId}),
      });
      const json=await resp.json();
      setLoading(false);
      if(!json.ok){setError(json.error);return;}
      setResultado(json);
    }
  }

  if(resultado)return <SenhaTemporariaModal info={{email,setupLink:resultado.setupLink}} onClose={()=>{onSaved();}}/>;

  return(
    <Modal title={editando?"Editar Usuário":"Novo Usuário"} onClose={onClose}
      footer={<><BtnSecondary onClick={onClose}>Cancelar</BtnSecondary>
        <BtnPrimary onClick={salvar} loading={loading}>{editando?"Salvar Alterações":"Criar Usuário"}</BtnPrimary></>}>
      <ErrorBox>{error}</ErrorBox>
      <div style={{display:"flex",flexDirection:"column",gap:14}}>
        <Field label="Nome completo" required>
          <input value={name} onChange={e=>setName(e.target.value)} style={inputStyle}/>
        </Field>
        <Field label="E-mail" required>
          <input type="email" value={email} onChange={e=>setEmail(e.target.value)} style={inputStyle} disabled={!!editando}/>
        </Field>
        <Field label="Tipo de usuário" required>
          <select value={userType} onChange={e=>setUserType(e.target.value)} style={inputStyle}>
            <option value="colaborador">Colaborador (oficina)</option>
            <option value="admin_area">Administrador de Filial</option>
            {profile.userType==="admin_geral"&&<option value="admin_geral">Administrador Geral</option>}
          </select>
        </Field>
        {userType!=="admin_geral"&&(
          <Field label="Filial" required>
            <select value={filialId} onChange={e=>setFilialId(e.target.value)} style={inputStyle} disabled={profile.userType==="admin_area"}>
              <option value="">Selecione...</option>
              {filiais.map(f=><option key={f.id} value={f.id}>{f.nome}</option>)}
            </select>
          </Field>
        )}
      </div>
    </Modal>
  );
}

function RelatoriosView({profile,filiais}){
  const isMobile=useIsMobile();
  const[ferramentas,setFerramentas]=useState([]);
  const[loading,setLoading]=useState(true);

  useEffect(()=>{
    let q=supabase.from("ferramentas").select("*, filial:filial_id(nome), colaborador_atual:colaborador_atual_id(name)").eq("ativo",true);
    if(profile.userType!=="admin_geral")q=q.eq("filial_id",profile.filialId);
    q.then(({data,error})=>{if(!error)setFerramentas(data||[]);setLoading(false);});
  },[profile.filialId]);

  const hoje=new Date();hoje.setHours(0,0,0,0);
  const vencidas=ferramentas.filter(f=>f.data_proxima_afericao&&new Date(f.data_proxima_afericao)<hoje&&f.status!=="em_afericao");
  const proximas=ferramentas.filter(f=>f.data_proxima_afericao&&diasEntre(hoje,new Date(f.data_proxima_afericao))<=7&&diasEntre(hoje,new Date(f.data_proxima_afericao))>=0&&f.status!=="em_afericao");

  function exportarAfericoes(){
    const rows=[...vencidas,...proximas].map(f=>({
      Código:f.codigo,Nome:f.nome,Filial:f.filial?.nome,Status:STATUS_FERRAMENTA_INFO[f.status]?.label,
      "Próxima Aferição":fmtDate(f.data_proxima_afericao),
    }));
    const ws=XLSX.utils.json_to_sheet(rows);
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,"Aferições");
    XLSX.writeFile(wb,"relatorio_afericoes.xlsx");
  }

  return(
    <div className="fade" style={{padding:isMobile?"20px 16px":"28px 32px"}}>
      <h1 style={{fontSize:22,fontWeight:800,color:"#111827",margin:"0 0 4px"}}>Relatórios</h1>
      <p style={{fontSize:13,color:"#6B7280",margin:"0 0 24px"}}>Aferições vencidas e próximas do prazo.</p>
      {loading?<div style={{padding:60,textAlign:"center"}}><Spinner size={20}/></div>:(
        <>
          <div style={{display:"flex",justifyContent:"flex-end",marginBottom:12}}>
            <BtnSecondary onClick={exportarAfericoes}><Download size={14}/>Exportar Excel</BtnSecondary>
          </div>
          <div style={{marginBottom:24}}>
            <h3 style={{fontSize:14,fontWeight:800,color:"#B91C1C",margin:"0 0 10px"}}>Vencidas ({vencidas.length})</h3>
            {vencidas.length===0?<p style={{fontSize:13,color:"#9CA3AF"}}>Nenhuma aferição vencida.</p>:(
              <div style={{display:"flex",flexDirection:"column",gap:8}}>
                {vencidas.map(f=><RelatorioLinha key={f.id} f={f}/>)}
              </div>
            )}
          </div>
          <div>
            <h3 style={{fontSize:14,fontWeight:800,color:"#D97706",margin:"0 0 10px"}}>Próximas 7 dias ({proximas.length})</h3>
            {proximas.length===0?<p style={{fontSize:13,color:"#9CA3AF"}}>Nenhuma aferição nos próximos 7 dias.</p>:(
              <div style={{display:"flex",flexDirection:"column",gap:8}}>
                {proximas.map(f=><RelatorioLinha key={f.id} f={f}/>)}
              </div>
            )}
          </div>
        </>
      )}
    </div>
  );
}
function RelatorioLinha({f}){
  return(
    <div style={{background:"#fff",border:"1px solid #F1F5F9",borderRadius:12,padding:"11px 14px",
      display:"flex",justifyContent:"space-between",alignItems:"center",gap:10,flexWrap:"wrap"}}>
      <div>
        <span style={{fontSize:11,color:"#9CA3AF",fontWeight:700}}>{f.codigo}</span>{" "}
        <span style={{fontSize:13.5,fontWeight:700,color:"#111827"}}>{f.nome}</span>
        <span style={{fontSize:12,color:"#6B7280"}}> · {f.filial?.nome}</span>
      </div>
      <div style={{fontSize:12.5,fontWeight:700,color:"#374151"}}>{fmtDate(f.data_proxima_afericao)}</div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════
   CONFIGURAÇÕES
   ══════════════════════════════════════════════════════════════ */
function MeuPerfilCard({profile}){
  const[novaSenha,setNovaSenha]=useState("");
  const[confirmar,setConfirmar]=useState("");
  const[loading,setLoading]=useState(false);
  const[msg,setMsg]=useState("");
  const[error,setError]=useState("");

  async function trocarSenha(){
    setError("");setMsg("");
    if(novaSenha.length<8){setError("A senha deve ter pelo menos 8 caracteres.");return;}
    if(novaSenha!==confirmar){setError("As senhas não coincidem.");return;}
    setLoading(true);
    const{error:err}=await supabase.auth.updateUser({password:novaSenha});
    setLoading(false);
    if(err){setError(err.message);return;}
    setMsg("Senha alterada com sucesso.");setNovaSenha("");setConfirmar("");
  }

  return(
    <div style={{background:"#fff",border:"1px solid #F1F5F9",borderRadius:16,padding:22,maxWidth:440}}>
      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:20}}>
        <div style={{width:48,height:48,borderRadius:14,background:profile.color||BLUE,display:"flex",
          alignItems:"center",justifyContent:"center",fontSize:15,fontWeight:800,color:"#fff"}}>
          {getInitials(profile.name)}
        </div>
        <div>
          <div style={{fontSize:15,fontWeight:800,color:"#111827"}}>{profile.name}</div>
          <div style={{fontSize:12.5,color:"#6B7280"}}>{profile.email}</div>
        </div>
      </div>
      <div style={{fontSize:12,fontWeight:700,color:"#9CA3AF",textTransform:"uppercase",marginBottom:10}}>Trocar senha</div>
      <ErrorBox>{error}</ErrorBox>
      {msg&&<div style={{padding:"10px 14px",borderRadius:9,background:"#ECFDF5",color:"#059669",fontSize:13,fontWeight:600,marginBottom:14}}>{msg}</div>}
      <div style={{display:"flex",flexDirection:"column",gap:12}}>
        <Field label="Nova senha"><input type="password" value={novaSenha} onChange={e=>setNovaSenha(e.target.value)} style={inputStyle}/></Field>
        <Field label="Confirmar nova senha"><input type="password" value={confirmar} onChange={e=>setConfirmar(e.target.value)} style={inputStyle}/></Field>
        <BtnPrimary onClick={trocarSenha} loading={loading}>Salvar nova senha</BtnPrimary>
      </div>
    </div>
  );
}

function ConfiguracoesView({profile,filiais,pessoas,reloadFiliais,activeSection,setActiveSection}){
  const isMobile=useIsMobile();
  const[novoNome,setNovoNome]=useState("");
  const[loading,setLoading]=useState(false);
  const[error,setError]=useState("");
  const isAdminGeral=profile.userType==="admin_geral";

  async function addFilial(){
    if(!novoNome.trim())return;
    setLoading(true);setError("");
    const{error:err}=await supabase.from("filiais").insert({nome:novoNome.trim()});
    setLoading(false);
    if(err){setError(err.message);return;}
    setNovoNome("");reloadFiliais();
  }

  const SECTIONS=[
    {id:"perfil",label:"Meu Perfil",Icon:UserCheck},
    {id:"usuarios",label:"Gestão de Usuários",Icon:UserPlus},
    ...(isAdminGeral?[{id:"filiais",label:"Filiais",Icon:Building2}]:[]),
  ];

  return(
    <div className="fade" style={{padding:isMobile?"20px 16px":"28px 32px"}}>
      <div style={{marginBottom:24}}>
        <h1 style={{fontSize:20,fontWeight:800,color:"#111827",margin:0}}>Configurações</h1>
        <p style={{fontSize:13,color:"#9CA3AF",marginTop:3}}>Gerencie configurações do sistema</p>
      </div>

      <div style={{display:"flex",gap:isMobile?14:20,alignItems:"flex-start",flexDirection:isMobile?"column":"row"}}>

        {SECTIONS.length>1&&(
        <div style={isMobile
          ?{width:"100%",display:"flex",gap:8}
          :{width:210,flexShrink:0,background:"#fff",borderRadius:14,
            border:"1px solid #F1F5F9",boxShadow:"0 1px 4px rgba(0,0,0,.04)",padding:8}}>
          {!isMobile&&(
            <p style={{fontSize:10,fontWeight:700,color:"#94A3B8",textTransform:"uppercase",
              letterSpacing:".07em",padding:"6px 10px 4px"}}>Configurações</p>
          )}
          {SECTIONS.map(s=>{
            const active=activeSection===s.id;
            return(
              <button key={s.id} onClick={()=>setActiveSection(s.id)}
                style={isMobile
                  ?{flex:1,display:"flex",alignItems:"center",justifyContent:"center",gap:7,padding:"10px 8px",
                    borderRadius:11,cursor:"pointer",
                    border:`1.5px solid ${active?BLUE:"#E5E7EB"}`,
                    background:active?`${BLUE}10`:"#fff",
                    color:active?BLUE:"#6B7280",fontWeight:700,fontSize:13,transition:"all .15s"}
                  :{width:"100%",display:"flex",alignItems:"center",gap:9,padding:"9px 12px",
                    borderRadius:10,border:"none",cursor:"pointer",textAlign:"left",
                    background:active?`${BLUE}10`:"transparent",
                    color:active?BLUE:"#374151",fontWeight:active?700:500,fontSize:13,
                    transition:"all .15s"}}>
                <s.Icon size={15} color={active?BLUE:"#9CA3AF"}/>
                {s.label}
              </button>
            );
          })}
        </div>
        )}

        <div style={{flex:1,minWidth:0}}>

          {activeSection==="perfil"&&(
            <MeuPerfilCard profile={profile}/>
          )}

          {activeSection==="usuarios"&&(
            <GestaoUsuariosView profile={profile} filiais={filiais}/>
          )}

          {activeSection==="filiais"&&isAdminGeral&&(<>
            <p style={{fontSize:15,fontWeight:800,color:"#111827",margin:"0 0 2px"}}>Filiais</p>
            <p style={{fontSize:12,color:"#9CA3AF",margin:"0 0 16px"}}>Filiais com oficina cadastradas no sistema</p>
            <div style={{maxWidth:440}}>
              <ErrorBox>{error}</ErrorBox>
              <div style={{display:"flex",gap:8,marginBottom:16}}>
                <input value={novoNome} onChange={e=>setNovoNome(e.target.value)} style={inputStyle} placeholder="Nome da nova filial"/>
                <BtnPrimary onClick={addFilial} loading={loading}>Adicionar</BtnPrimary>
              </div>
              <div style={{display:"flex",flexDirection:"column",gap:8}}>
                {filiais.map(f=>(
                  <div key={f.id} style={{padding:"10px 14px",background:"#fff",border:"1px solid #F1F5F9",borderRadius:10,
                    fontSize:13.5,fontWeight:600,color:"#111827"}}>
                    {f.nome}
                  </div>
                ))}
              </div>
            </div>
          </>)}

        </div>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════
   APP
   ══════════════════════════════════════════════════════════════ */
function App(){
  const[status,setStatus]=useState(_RESET_TOKEN?"reset_password":"loading");
  const[profile,setProfile]=useState(null);
  const[filiais,setFiliais]=useState([]);
  const[pessoas,setPessoas]=useState([]);
  const[activeNav,setActiveNav]=useState(null);
  const[configSection,setConfigSection]=useState("perfil");
  const[notifications,setNotifications]=useState([]);
  const[notifOpen,setNotifOpen]=useState(false);
  const[drawerOpen,setDrawerOpen]=useState(false);
  const[viewingProfile,setViewingProfile]=useState(false);
  const isMobile=useIsMobile();

  async function loadFiliais(){
    const{data}=await supabase.from("filiais").select("*").eq("ativo",true).order("nome");
    setFiliais(data||[]);
  }
  async function loadPessoas(){
    const{data}=await supabase.from("profiles").select("id,name,filial_id").eq("is_active",true).order("name");
    setPessoas(data||[]);
  }
  async function loadNotifications(userId){
    const{data}=await supabase.from("notifications").select("*").eq("user_id",userId).order("created_at",{ascending:false}).limit(30);
    setNotifications(data||[]);
  }

  async function initUser(session){
    const{data:prof,error}=await supabase.from("profiles").select("*, filial:filial_id(nome)").eq("id",session.user.id).single();
    if(error||!prof||!prof.is_active){
      await supabase.auth.signOut();
      setStatus("login");
      return;
    }
    setProfile({
      id:prof.id,name:prof.name,email:prof.email,userType:prof.user_type,
      filialId:prof.filial_id,filialNome:prof.filial?.nome,color:prof.color,
    });
    setActiveNav(prof.user_type==="colaborador"?"ferramentas":"dashboard");
    await Promise.all([loadFiliais(),loadPessoas(),loadNotifications(prof.id)]);
    setStatus("ready");
  }

  useEffect(()=>{
    if(_RESET_TOKEN)return;
    supabase.auth.getSession().then(({data})=>{
      if(data.session)initUser(data.session);
      else setStatus("login");
    });
  },[]);

  async function handleLogout(){
    await supabase.auth.signOut();
    setProfile(null);setStatus("login");
  }

  if(status==="loading")return <LoadingScreen/>;
  if(status==="reset_password")return <ResetPasswordScreen/>;
  if(status==="login")return <LoginScreen onLoginSuccess={initUser}/>;
  if(!profile)return <LoadingScreen/>;

  const markNotifRead=async(id)=>{
    await supabase.from("notifications").update({is_read:true}).eq("id",id);
    setNotifications(prev=>prev.map(n=>n.id===id?{...n,is_read:true}:n));
  };
  const markAllNotifRead=async()=>{
    const ids=notifications.filter(n=>!n.is_read).map(n=>n.id);
    if(ids.length===0)return;
    await supabase.from("notifications").update({is_read:true}).in("id",ids);
    setNotifications(prev=>prev.map(n=>({...n,is_read:true})));
  };

  const commonProps={profile,filiais,pessoas};
  let content=null;
  if(viewingProfile){
    content=<div style={{padding:isMobile?"20px 16px":"28px 32px"}}>
      <button onClick={()=>setViewingProfile(false)} style={{display:"flex",alignItems:"center",gap:6,border:"none",
        background:"none",color:"#6B7280",fontSize:13,fontWeight:600,cursor:"pointer",padding:0,marginBottom:16}}>
        <ArrowLeft size={14}/>Voltar
      </button>
      <MeuPerfilCard profile={profile}/>
    </div>;
  }else{
    switch(activeNav){
      case "dashboard": content=<DashboardView {...commonProps}/>; break;
      case "ferramentas": content=<FerramentasView {...commonProps}/>; break;
      case "movimentacoes": content=<MovimentacoesView {...commonProps}/>; break;
      case "manutencoes": content=<ManutencoesView {...commonProps}/>; break;
      case "auditorias": content=<AuditoriasView {...commonProps}/>; break;
      case "relatorios": content=<RelatoriosView {...commonProps}/>; break;
      case "configuracoes": content=<ConfiguracoesView {...commonProps} reloadFiliais={loadFiliais}
        activeSection={configSection} setActiveSection={setConfigSection}/>; break;
      default: content=null;
    }
  }

  return(
    <div style={{height:"100vh",display:"flex",background:"#F8FAFC"}}>
      <Sidebar currentUser={profile} activeNav={activeNav} setActiveNav={id=>{setActiveNav(id);setViewingProfile(false);}}
        onLogout={handleLogout} onViewProfile={()=>setViewingProfile(true)}
        notifications={notifications} notifOpen={notifOpen} onNotifToggle={()=>setNotifOpen(v=>!v)}
        markNotifRead={markNotifRead} markAllNotifRead={markAllNotifRead}
        isMobile={isMobile} drawerOpen={drawerOpen} onRequestClose={()=>setDrawerOpen(false)}/>
      <main style={{flex:1,overflowY:"auto",minWidth:0}} onClick={()=>notifOpen&&setNotifOpen(false)}>
        {isMobile&&(
          <div style={{height:56,display:"flex",alignItems:"center",padding:"0 16px",borderBottom:"1px solid #F1F5F9",
            background:"#fff",position:"sticky",top:0,zIndex:50}}>
            <button onClick={e=>{e.stopPropagation();setDrawerOpen(true);}}
              style={{border:"none",background:"none",cursor:"pointer",color:"#374151",display:"flex"}}>
              <Menu size={20}/>
            </button>
            <div style={{marginLeft:14}}><Logo color="#0A0A0B" height={13}/></div>
          </div>
        )}
        {content}
      </main>
    </div>
  );
}

const root=createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
</body>
</html>
