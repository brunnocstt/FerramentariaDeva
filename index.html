<!-- Error display: catches Babel parse errors and unhandled JS exceptions -->
<script>
(function(){
  var shown=false;
  function showErr(msg,src,line){
    if(shown||document.getElementById('root').childNodes.length)return;
    shown=true;
    var root=document.getElementById('root');
    root.textContent='';
    var box=document.createElement('div');
    box.style.cssText='padding:40px;font-family:system-ui,sans-serif;background:#fff;min-height:100vh';
    var inner=document.createElement('div');
    inner.style.cssText='max-width:500px;margin:0 auto;padding-top:80px';
    var icon=document.createElement('div');
    icon.style.cssText='width:52px;height:52px;background:#FEF2F2;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:20px';
    icon.textContent='⚠️';
    var h2=document.createElement('h2');
    h2.style.cssText='font-size:18px;font-weight:800;color:#111827;margin:0 0 8px';
    h2.textContent='Falha ao carregar o sistema';
    var pMsg=document.createElement('p');
    pMsg.style.cssText='font-size:13px;color:#6B7280;line-height:1.6;margin:0 0 6px';
    pMsg.textContent=String(msg||'');
    inner.appendChild(icon);inner.appendChild(h2);inner.appendChild(pMsg);
    if(src){
      var pSrc=document.createElement('p');
      pSrc.style.cssText='font-size:11px;color:#9CA3AF;margin:0 0 20px';
      pSrc.textContent=String(src)+(line?':'+String(line):'');
      inner.appendChild(pSrc);
    }
    var btn=document.createElement('button');
    btn.style.cssText='padding:10px 20px;background:#1955FF;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer';
    btn.textContent='↻ Tentar novamente';
    btn.onclick=function(){location.reload();};
    var pHint=document.createElement('p');
    pHint.style.cssText='font-size:11px;color:#9CA3AF;margin-top:12px';
    pHint.textContent='Se o problema persistir, pressione Ctrl+Shift+R para limpar o cache.';
    inner.appendChild(btn);inner.appendChild(pHint);
    box.appendChild(inner);root.appendChild(box);
  }
  window.addEventListener('error',function(e){showErr(e.message,e.filename,e.lineno);});
  window.addEventListener('unhandledrejection',function(e){
    var msg=(e.reason&&e.reason.message)||String(e.reason)||'Erro de rede';
    showErr(msg,'','');
  });
})();
</script>

// Layout "mobile" (menu no rodapé, cards em vez de tabela etc.): celular sempre, e tablet só
// quando em pé — deitado (largura ≥ altura) o tablet usa o layout de computador normalmente.
// Baseado em orientação, não só largura, porque a largura de um tablet em pé (768–834px típico)
// se sobrepõe à faixa "estreita" que também acontece num navegador de computador redimensionado.
const MOBILE_BREAKPOINT=768;
function isMobileViewport(){
  if(typeof window==="undefined")return false;
  const w=window.innerWidth,h=window.innerHeight;
  return w<MOBILE_BREAKPOINT||(h>w&&w<=1200);
}
function useIsMobile(){
  const[mobile,setMobile]=useState(isMobileViewport);
  useEffect(()=>{
    const fn=()=>setMobile(isMobileViewport());
    window.addEventListener("resize",fn);
    window.addEventListener("orientationchange",fn);
    return()=>{window.removeEventListener("resize",fn);window.removeEventListener("orientationchange",fn);};
  },[]);
  return mobile;
}

/* ── HELPERS ────────────────────────────────────── */
function fmtDate(d){
  if(!d)return "—";
  const dt=new Date(d+(String(d).length<=10?"T00:00:00":""));
  if(isNaN(dt))return "—";
  return dt.toLocaleDateString("pt-BR");
}
function fmtDateTime(d){
  if(!d)return "—";
  const dt=new Date(d);
  if(isNaN(dt))return "—";
  return dt.toLocaleDateString("pt-BR")+" às "+dt.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
}
function getInitials(name){
  if(!name)return "US";
  const parts=String(name).trim().split(/\s+/).slice(0,2);
  return parts.map(p=>p[0]?.toUpperCase()||"").join("")||"US";
}

// Alguns catálogos ganharam um sufixo " (código)" no nome pra virarem únicos no banco
// (import real de Montes Claros — ver memória do projeto). Quando o código já aparece
// junto na tela (ex.: "381000186" + nome), esse sufixo é só ruído redundante — removido
// aqui só na exibição, o dado salvo continua intacto.
function nomeLimpo(nome,codigo){
  if(!nome||!codigo)return nome;
  const suf=` (${String(codigo).trim()})`;
  return nome.endsWith(suf)?nome.slice(0,-suf.length):nome;
}
function diasEntre(d1,d2=new Date()){
  const a=new Date(d1),b=new Date(d2);
  return Math.floor((b-a)/86400000);
}
function fmtDuracao(iso){
  if(!iso)return "—";
  return fmtDuracaoMs(Date.now()-new Date(iso).getTime());
}
// Formata um intervalo de milissegundos já calculado (usado pra durações fechadas, entre duas
// datas, diferente do fmtDuracao acima que sempre mede "até agora").
function fmtDuracaoMs(ms){
  if(!(ms>=0))return "—";
  const min=Math.floor(ms/60000);
  if(min<1)return "agora";
  if(min<60)return `${min} min`;
  const h=Math.floor(min/60);
  if(h<24)return `${h}h${min%60?String(min%60).padStart(2,"0")+"min":""}`;
  const dias=Math.floor(h/24);
  return `${dias}d${h%24?(h%24)+"h":""}`;
}
// Duração entre retirada e devolução — se ainda não devolveu, mede até agora e sinaliza "aberta".
function fmtDuracaoEntre(inicioIso,fimIso){
  if(!inicioIso)return "—";
  const fim=fimIso?new Date(fimIso).getTime():Date.now();
  return fmtDuracaoMs(fim-new Date(inicioIso).getTime());
}

function Spinner({size=16,color="#1955FF"}){
  return(
    <svg className="spin" width={size} height={size} viewBox="0 0 24 24" fill="none">
      <circle cx="12" cy="12" r="10" stroke={color} strokeWidth="3" opacity=".2"/>
      <path d="M22 12a10 10 0 0 0-10-10" stroke={color} strokeWidth="3" strokeLinecap="round"/>
    </svg>
  );
}

/* ── PRIMITIVOS DE UI ───────────────────────────── */
function Field({label,required,children,as,hint}){
  const Tag=as||"label";
  return(
    <Tag style={{display:"block"}}>
      {label&&<div style={{fontSize:12,fontWeight:700,color:"#374151",marginBottom:6,letterSpacing:".3px"}}>
        {label}{required&&<span style={{color:"#DC2626"}}> *</span>}
      </div>}
      {children}
      {hint&&<div style={{fontSize:11,color:"#9CA3AF",marginTop:4}}>{hint}</div>}
    </Tag>
  );
}
const inputStyle={
  width:"100%",padding:"10px 12px",fontSize:14,borderRadius:9,
  border:"1.5px solid #E5E7EB",color:"#111827",background:"#fff",
  transition:"border-color .15s",
};

function Modal({title,onClose,children,width=480,footer}){
  return(
    <div className="fade" style={{position:"fixed",inset:0,zIndex:2000,background:"rgba(15,23,42,.5)",
      display:"flex",alignItems:"center",justifyContent:"center",padding:16}} onClick={onClose}>
      <div className="up modal-box" style={{width:"100%",maxWidth:width,background:"#fff",borderRadius:18,
        boxShadow:"0 20px 60px rgba(0,0,0,.25)",display:"flex",flexDirection:"column",overflow:"hidden"}}
        onClick={e=>e.stopPropagation()}>
        <div style={{padding:"18px 22px",borderBottom:"1px solid #F1F5F9",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <h3 style={{fontSize:16,fontWeight:800,color:"#111827",margin:0}}>{title}</h3>
          <button onClick={onClose} style={{border:"none",background:"#F3F4F6",borderRadius:8,width:28,height:28,
            display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",color:"#6B7280"}}>
            <X size={15}/>
          </button>
        </div>
        <div style={{padding:22,overflowY:"auto",flex:1,minHeight:0,WebkitOverflowScrolling:"touch"}}>{children}</div>
        {footer&&<div style={{padding:"16px 22px",borderTop:"1px solid #F1F5F9",display:"flex",justifyContent:"flex-end",gap:10}}>{footer}</div>}
      </div>
    </div>
  );
}
function BtnPrimary({children,onClick,disabled,loading,type="button",danger}){
  return(
    <button type={type} onClick={onClick} disabled={disabled||loading} className="btnblue"
      style={{padding:"10px 18px",borderRadius:9,border:"none",
        background:danger?"#DC2626":BLUE,color:"#fff",fontWeight:700,fontSize:13,
        cursor:(disabled||loading)?"not-allowed":"pointer",display:"flex",alignItems:"center",gap:8,
        whiteSpace:"nowrap",flexShrink:0,opacity:(disabled)?.5:1}}>
      {loading&&<Spinner size={13} color="#fff"/>}{children}
    </button>
  );
}
function BtnSecondary({children,onClick,disabled}){
  return(
    <button type="button" onClick={onClick} disabled={disabled}
      style={{padding:"10px 18px",borderRadius:9,border:"1.5px solid #E5E7EB",
        background:"#fff",color:"#374151",fontWeight:700,fontSize:13,cursor:disabled?"not-allowed":"pointer",
        display:"flex",alignItems:"center",gap:8,whiteSpace:"nowrap",flexShrink:0,
        opacity:disabled?.5:1}}>
      {children}
    </button>
  );
}
function ErrorBox({children}){
  if(!children)return null;
  return(
    <div style={{display:"flex",alignItems:"flex-start",gap:8,padding:"11px 14px",borderRadius:10,
      background:"#FEF2F2",color:"#B91C1C",fontSize:13,fontWeight:500,border:"1px solid #FECACA",marginBottom:16}}>
      <AlertCircle size={14} style={{marginTop:2,flexShrink:0}}/>{children}

}
function EmptyState({icon:Icon,title,text}){

      {text&&<div style={{fontSize:13,marginTop:4}}>{text}</div>}

}
function StatCard({label,value,Icon,color=BLUE}){

// nunca usada em produção. Evita depender de liberar domínios de dev no Turnstile.
const DEV_TURNSTILE_SITE_KEY="1x00000000000000000000AA";

function LoginScreen({onLoginSuccess}){
  const[email,setEmail]=useState("");
  const[password,setPassword]=useState("");

  const[error,setError]=useState("");
  const[captchaToken,setCaptchaToken]=useState("");
  const captchaRef=useRef(null);
  const widgetIdRef=useRef(null);

  useEffect(()=>{
    let cancelled=false;
    let iv=null;
    function renderWidget(){
      if(cancelled||!captchaRef.current||widgetIdRef.current!==null)return;
      try{
        widgetIdRef.current=window.turnstile.render(captchaRef.current,{
          sitekey:TURNSTILE_SITE_KEY,language:"pt-br",theme:"light",
          callback:t=>setCaptchaToken(t),
          "expired-callback":()=>setCaptchaToken(""),
          "error-callback":()=>setCaptchaToken(""),
        });
      }catch(_){}
    }
    if(window.turnstile)renderWidget();
    else iv=setInterval(()=>{if(window.turnstile){clearInterval(iv);iv=null;renderWidget();}},200);
    return()=>{cancelled=true;if(iv)clearInterval(iv);};
  },[]);

  function resetCaptcha(){
    setCaptchaToken("");
    if(window.turnstile&&widgetIdRef.current!==null){try{window.turnstile.reset(widgetIdRef.current);}catch(_){}}
  }

  async function handleLogin(e){
    e.preventDefault();
    if(!email||!password)return;
    if(!captchaToken){setError("Aguarde a verificação de segurança e tente novamente.");return;}
    setLoading(true);setError("");
    const{data,error:err}=await supabase.auth.signInWithPassword({email,password,options:{captchaToken}});
    if(err){
      const msg=/captcha/i.test(err.message||"")
        ?"Falha na verificação de segurança. Tente novamente."
        :"E-mail ou senha inválidos.";
      setError(msg);setLoading(false);resetCaptcha();
    }
    else{await onLoginSuccess(data.session);}
  }

  return(
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",
      background:"#F8FAFC",padding:"24px 20px",position:"relative",overflow:"hidden"}}>
      <div style={{position:"absolute",top:"-15%",left:"50%",transform:"translateX(-50%)",
        width:"120%",maxWidth:900,height:"50%",
        background:"radial-gradient(ellipse, rgba(25,85,255,.10) 0%, transparent 70%)",pointerEvents:"none"}}/>
      <div style={{width:"100%",maxWidth:400,position:"relative",background:"#fff",

              borderRadius:99,background:`${BLUE}10`,border:`1px solid ${BLUE}22`,marginBottom:18}}>
              <Wrench size={11} color={BLUE}/>
              <span style={{fontSize:11,fontWeight:700,color:BLUE,letterSpacing:".5px",textTransform:"uppercase"}}>
                Controle de Ferramentaria
              </span>
            </div>
            <h1 style={{fontSize:28,fontWeight:800,color:"#111827",letterSpacing:"-.5px",margin:"0 0 10px",lineHeight:1.2}}>
              Bem-vindo
            </h1>
            <p style={{fontSize:14,color:"#6B7280",margin:0,lineHeight:1.6}}>
              Acesse com as credenciais fornecidas pelo administrador do sistema.
            </p>
          </div>
          <ErrorBox>{error}</ErrorBox>
          <form onSubmit={handleLogin} style={{display:"flex",flexDirection:"column",gap:16}}>
            <div>
              <label style={{fontSize:12,fontWeight:700,color:"#374151",display:"block",marginBottom:6,letterSpacing:".3px"}}>
                E-mail corporativo
              </label>
              <div style={{position:"relative"}}>
                <Mail size={15} color="#9CA3AF" style={{position:"absolute",left:13,top:"50%",transform:"translateY(-50%)",pointerEvents:"none"}}/>
                <input type="email" required value={email} onChange={e=>setEmail(e.target.value)}
                  style={{...inputStyle,padding:"12px 14px",paddingLeft:40}} placeholder="nome@deva.com.br"/>
              </div>
            </div>
            <div>
              <label style={{fontSize:12,fontWeight:700,color:"#374151",display:"block",marginBottom:6,letterSpacing:".3px"}}>
                Senha
              </label>
              <div style={{position:"relative"}}>
                <Lock size={15} color="#9CA3AF" style={{position:"absolute",left:13,top:"50%",transform:"translateY(-50%)",pointerEvents:"none"}}/>

          </div>

      </div>
    </div>

function ResetPasswordScreen(){
  const[password,setPassword]=useState("");
  const[confirm,setConfirm]=useState("");
  const[showPass,setShowPass]=useState(false);
  const[showConfirm,setShowConfirm]=useState(false);
  const[loading,setLoading]=useState(false);
  const[error,setError]=useState("");
  const[done,setDone]=useState(false);

  async function handleSubmit(e){
    e.preventDefault();
    if(password.length<8){setError("A senha deve ter pelo menos 8 caracteres.");return;}
    if(password!==confirm){setError("As senhas não coincidem.");return;}
    setLoading(true);setError("");
    const{data:res,error:fnErr}=await supabase.functions.invoke("send-email",{
      body:{emailType:"reset_password_verify",token:_RESET_TOKEN,newPassword:password},
    });
    setLoading(false);
    if(fnErr||!res?.ok){setError(res?.error||"Não foi possível redefinir a senha. O link pode ter expirado.");return;}
    setDone(true);
  }

  return(
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"#F8FAFC",padding:"24px 20px"}}>
      <div style={{width:"100%",maxWidth:400,background:"#fff",borderRadius:20,border:"1px solid #F1F5F9",
        boxShadow:"0 12px 48px rgba(15,23,42,.08)",padding:"40px 32px"}}>
        <div style={{display:"flex",justifyContent:"center",marginBottom:28}}><Logo color="#0A0A0B" height={18}/></div>
        {done?(
          <div style={{textAlign:"center"}}>

              justifyContent:"center",margin:"0 auto 18px"}}><Check size={24} color="#059669"/></div>
            <h2 style={{fontSize:18,fontWeight:800,color:"#111827",margin:"0 0 8px"}}>Senha redefinida!</h2>
            <p style={{fontSize:13,color:"#6B7280",margin:"0 0 24px",lineHeight:1.6}}>Já pode acessar o sistema com sua nova senha.</p>
            <BtnPrimary onClick={()=>{window.location.href=window.location.origin+window.location.pathname;}}>
              Ir para o login
            </BtnPrimary>
          </div>
        ):(
          <>
            <h1 style={{fontSize:22,fontWeight:800,color:"#111827",margin:"0 0 8px",textAlign:"center"}}>Nova senha</h1>
            <p style={{fontSize:13,color:"#6B7280",margin:"0 0 24px",textAlign:"center",lineHeight:1.6}}>
              Defina uma nova senha para acessar o sistema.
            </p>
            <ErrorBox>{error}</ErrorBox>
            <form onSubmit={handleSubmit} style={{display:"flex",flexDirection:"column",gap:16}}>
              <Field label="Nova senha" required>
                <div style={{position:"relative"}}>
                  <input type={showPass?"text":"password"} required value={password} onChange={e=>setPassword(e.target.value)}
                    style={{...inputStyle,paddingRight:44}} placeholder="Mínimo 8 caracteres"/>
                  <button type="button" tabIndex={-1} onClick={()=>setShowPass(v=>!v)}
                    style={{position:"absolute",right:12,top:"50%",transform:"translateY(-50%)",border:"none",
                      background:"none",cursor:"pointer",padding:0,color:"#9CA3AF"}}>
                    {showPass?<EyeOff size={15}/>:<EyeIcon size={15}/>}
                  </button>
                </div>
              </Field>
              <Field label="Confirmar nova senha" required>
                <div style={{position:"relative"}}>
                  <input type={showConfirm?"text":"password"} required value={confirm} onChange={e=>setConfirm(e.target.value)}
                    style={{...inputStyle,paddingRight:44}} placeholder="Repita a senha"/>
                  <button type="button" tabIndex={-1} onClick={()=>setShowConfirm(v=>!v)}
                    style={{position:"absolute",right:12,top:"50%",transform:"translateY(-50%)",border:"none",
                      background:"none",cursor:"pointer",padding:0,color:"#9CA3AF"}}>
                    {showConfirm?<EyeOff size={15}/>:<EyeIcon size={15}/>}
                  </button>
                </div>
              </Field>
              <BtnPrimary type="submit" loading={loading} disabled={loading}>
                {loading?"Salvando...":"Salvar nova senha"}
              </BtnPrimary>
            </form>
          </>
        )}
      </div>
    </div>
  );
}

function UserFooterMenu({currentUser,collapsed,onViewProfile,onLogout}){
  const[open,setOpen]=useState(false);
  const[pos,setPos]=useState({left:0,bottom:0});
  const wrapRef=useRef(null);
  const popRef=useRef(null);
  useEffect(()=>{
    if(!open)return;
    function onDoc(e){
      if(popRef.current&&popRef.current.contains(e.target))return;
      if(wrapRef.current&&wrapRef.current.contains(e.target))return;
      setOpen(false);
    }
    document.addEventListener("mousedown",onDoc);
    return()=>document.removeEventListener("mousedown",onDoc);
  },[open]);

  // Posição calculada em pixels de tela (não relativa ao menu lateral) — o pop-up é
  // renderizado via Portal direto no <body>, então não fica cortado pelo overflow:hidden
  // do <aside> quando o menu está recolhido ou a lista é maior que a área visível.
  function toggle(){
    if(!open&&wrapRef.current){
      const r=wrapRef.current.getBoundingClientRect();
      setPos({left:r.left+8,bottom:window.innerHeight-r.top+8});
    }
    setOpen(v=>!v);
  }

  return(
    <div ref={wrapRef} style={{padding:8,borderTop:"1px solid rgba(255,255,255,.07)",position:"relative"}}>
      <button onClick={toggle}
        style={{width:"100%",height:46,position:"relative",borderRadius:9,
          border:"none",background:open?"#18181B":"transparent",cursor:"pointer",textAlign:"left"}}>
        <div style={{position:"absolute",left:6,top:"50%",transform:"translateY(-50%)"}}>
          <Avatar name={currentUser.name} color={currentUser.color} avatarUrl={currentUser.avatarUrl} size={30}/>
        </div>
        {!collapsed&&(
          <div style={{position:"absolute",left:44,right:8,top:"50%",transform:"translateY(-50%)",minWidth:0,
            opacity:0,animation:"fadeIn .22s ease .08s forwards"}}>
            <div style={{fontSize:12.5,fontWeight:700,color:"#fff",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{currentUser.name}</div>
            <div style={{fontSize:10.5,color:"#71717A",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{currentUser.filialNome||"Todas as filiais"}</div>
          </div>
        )}
      </button>
      {open&&createPortal(
        <div ref={popRef} className="up" style={{position:"fixed",left:pos.left,bottom:pos.bottom,width:220,background:"#18181B",
          borderRadius:12,border:"1px solid rgba(255,255,255,.08)",boxShadow:"0 16px 40px rgba(0,0,0,.4)",
          padding:6,zIndex:1200}}>
          <button onClick={()=>{onViewProfile();setOpen(false);}}
            style={{width:"100%",display:"flex",alignItems:"center",gap:10,padding:"9px 12px",borderRadius:8,
              border:"none",background:"transparent",cursor:"pointer",textAlign:"left",color:"#D4D4D8",fontSize:13,fontWeight:500}}
            onMouseEnter={e=>{e.currentTarget.style.background="#27272A";}}
            onMouseLeave={e=>{e.currentTarget.style.background="transparent";}}>
            <UserCheck size={14}/>Meu Perfil
          </button>
          <button onClick={onLogout}
            style={{width:"100%",display:"flex",alignItems:"center",gap:10,padding:"9px 12px",borderRadius:8,
              border:"none",background:"transparent",cursor:"pointer",textAlign:"left",color:"#D4D4D8",fontSize:13,fontWeight:500}}
            onMouseEnter={e=>{e.currentTarget.style.background="#27272A";e.currentTarget.style.color="#FCA5A5";}}
            onMouseLeave={e=>{e.currentTarget.style.background="transparent";e.currentTarget.style.color="#D4D4D8";}}>
            <LogOut size={14}/>Sair
          </button>
        </div>,
        document.body
      )}
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════
   BARRA DE NAVEGAÇÃO MOBILE (rodapé fixo) — substitui o menu lateral em
   celular e em tablet quando em pé (ver isMobileViewport). O topo (logo,
   sino de notificações e avatar) fica no cabeçalho fixo montado pelo App().
   ══════════════════════════════════════════════════════════════ */
function MobileBottomNav({items,activeNav,setActiveNav}){
  // A folga de baixo (área do gesto do sistema) fica numa faixa própria, separada da fileira
  // de botões — assim a centralização do ícone+texto dentro do botão nunca depende de como o
  // Safari calcula padding num container flex (foi isso que descentralizou da primeira vez).
  return(
    <nav style={{flexShrink:0,zIndex:40,display:"flex",flexDirection:"column",background:"#fff",
      borderTop:"1px solid #F1F5F9",boxShadow:"0 -2px 12px rgba(0,0,0,.05)"}}>
      <div style={{display:"flex",height:64}}>
        {items.map(({id,label,Icon})=>{
          const active=activeNav===id;
          return(
            <button key={id} onClick={()=>setActiveNav(id)}
              style={{flex:1,minWidth:0,height:"100%",margin:0,padding:0,border:"none",
                background:"transparent",WebkitAppearance:"none",appearance:"none",
                cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",
                justifyContent:"center",gap:4,color:active?BLUE:"#94A3B8"}}>
              <Icon size={21} color="currentColor"/>
              <span style={{fontSize:10,fontWeight:700,whiteSpace:"nowrap",lineHeight:1.4,
                overflow:"hidden",textOverflow:"ellipsis",maxWidth:"100%",padding:"0 2px"}}>
                {label}
              </span>
            </button>
          );
        })}
      </div>
      {/* Folga mínima garantida mesmo sem inset nenhum; o viewport-fit=cover no <head> é o que
          faz o env() de verdade vir preenchido em vez de 0. */}
      <div style={{flexShrink:0,height:"max(10px,env(safe-area-inset-bottom))"}}/>
    </nav>
  );
}

function UsoAoVivoPanel(){
  const[unidades,setUnidades]=useState([]);
  const[emprestimos,setEmprestimos]=useState([]);
  const[loading,setLoading]=useState(true);
  const[,setTick]=useState(0);

  const load=useCallback(async()=>{
    const[{data:dU},{data:dE}]=await Promise.all([
      supabase.from("ferramentas_unidade")
        .select("id,codigo,data_retirada_atual,catalogo:catalogo_id(nome),colaborador:colaborador_atual_id(name)")
        .eq("status","com_colaborador").order("data_retirada_atual",{ascending:true}),
      supabase.from("emprestimos")
        .select("id,quantidade,data_retirada,estoque:estoque_id(catalogo:catalogo_id(nome)),colaborador:colaborador_id(name)")
        .is("data_devolucao",null).order("data_retirada",{ascending:true}),
    ]);
    setUnidades(dU||[]);
    setEmprestimos(dE||[]);
    setLoading(false);
  },[]);

  useEffect(()=>{load();},[load]);

  useEffect(()=>{
    const ch=supabase.channel("uso-ao-vivo-rt")
      .on("postgres_changes",{event:"*",schema:"public",table:"ferramentas_unidade"},()=>load())
      .on("postgres_changes",{event:"*",schema:"public",table:"emprestimos"},()=>load())
      .subscribe();
    return()=>supabase.removeChannel(ch);
  },[load]);

  useEffect(()=>{
    const t=setInterval(()=>setTick(n=>n+1),30000);
    return()=>clearInterval(t);
  },[]);

  const itens=useMemo(()=>[
    ...unidades.map(u=>({key:"u-"+u.id,colaborador:u.colaborador?.name,ferramenta:nomeLimpo(u.catalogo?.nome,u.codigo),detalhe:u.codigo,desde:u.data_retirada_atual})),
    ...emprestimos.map(e=>({key:"e-"+e.id,colaborador:e.colaborador?.name,ferramenta:e.estoque?.catalogo?.nome,detalhe:`${e.quantidade}x`,desde:e.data_retirada})),
  ].sort((a,b)=>new Date(a.desde)-new Date(b.desde)),[unidades,emprestimos]);

  return(
    <div style={{marginTop:14,background:"#fff",border:"1px solid #F1F5F9",borderRadius:14,padding:"18px 20px"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12,flexWrap:"wrap",gap:6}}>
        <h2 style={{fontSize:15,fontWeight:800,color:"#111827",margin:0}}>Ferramentas em Uso</h2>
        <span style={{fontSize:11,color:"#9CA3AF"}}>{itens.length} em uso agora</span>
      </div>
      {loading?<div style={{padding:24,textAlign:"center"}}><Spinner size={18}/></div>:
      itens.length===0?<EmptyState icon={PackageCheck} title="Nenhuma ferramenta com colaborador no momento"/>:(
        <div style={{display:"flex",flexDirection:"column",gap:6}}>
          {itens.map(it=>(
            <div key={it.key} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"9px 12px",
              background:"#F9FAFB",borderRadius:9,flexWrap:"wrap",gap:6}}>
              <div>
                <span style={{fontSize:13.5,fontWeight:700,color:"#111827"}}>{it.ferramenta||"—"}</span>{" "}
                <span style={{fontSize:11,color:"#9CA3AF"}}>{it.detalhe}</span>
                <div style={{fontSize:11.5,color:"#6B7280"}}>com {it.colaborador||"—"}</div>
              </div>
              <span style={{fontSize:11.5,fontWeight:700,color:BLUE,background:"#EEF2FF",padding:"3px 9px",borderRadius:999,whiteSpace:"nowrap"}}>
                há {fmtDuracao(it.desde)}
              </span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function DashboardView({profile,filiais}){
  const[stats,setStats]=useState(null);
  const[atingimento,setAtingimento]=useState(null);
  const[checklistFaltando,setChecklistFaltando]=useState([]);
  const[loading,setLoading]=useState(true);

  useEffect(()=>{
    let cancelled=false;
    async function load(){
      setLoading(true);
      let q=supabase.from("ferramentas_unidade").select("status,data_proxima_afericao,ativo,data_validade_licenca,catalogo:catalogo_id(requer_licenca)");
      let qE=supabase.from("estoque_pool").select("id,quantidade_total,data_validade_licenca,catalogo:catalogo_id(requer_licenca)");
      let qEmp=supabase.from("emprestimos").select("estoque_id,quantidade").is("data_devolucao",null);
      // Lista mestre da checklist oficial Especifer/Iveco (228 itens fixos) — o vínculo com o
      // catálogo (catalogo_id) é mantido dinamicamente por trigger no banco: cadastrar uma
      // ferramenta com o código certo já entra na contagem sozinho, sem reprocessar nada aqui.
      const{data:checklist}=await supabase.from("checklist_especifer_itens").select("id,codigo,descricao,catalogo_id").order("ordem");
      const idsChecklist=[...new Set((checklist||[]).filter(c=>c.catalogo_id).map(c=>c.catalogo_id))];
      let qUnidObrig=supabase.from("ferramentas_unidade").select("filial_id,catalogo_id,status,ativo").eq("ativo",true).in("catalogo_id",idsChecklist.length?idsChecklist:["00000000-0000-0000-0000-000000000000"]);
      let qPoolObrig=supabase.from("estoque_pool").select("id,filial_id,catalogo_id,quantidade_total").in("catalogo_id",idsChecklist.length?idsChecklist:["00000000-0000-0000-0000-000000000000"]);
      if(profile.userType!=="admin_geral"){
        q=q.in("filial_id",profile.filialIds);qE=qE.in("filial_id",profile.filialIds);
        qUnidObrig=qUnidObrig.in("filial_id",profile.filialIds);qPoolObrig=qPoolObrig.in("filial_id",profile.filialIds);
      }
      const[{data,error},{data:dataE},{data:dataEmp},{data:unidObrig},{data:poolObrig}]=await Promise.all([q,qE,qEmp,qUnidObrig,qPoolObrig]);
      if(cancelled)return;
      const empMap={};
      (dataEmp||[]).forEach(e=>{empMap[e.estoque_id]=(empMap[e.estoque_id]||0)+e.quantidade;});
      if(!error&&data){
        const s={total:data.length,disponivel:0,com_colaborador:0,em_afericao:0,em_conserto:0,extraviada:0,baixada:0,
          vencidas:0,proximas:0,licencasVencidas:0,licencasProximas:0};
        const hoje=new Date();hoje.setHours(0,0,0,0);
        data.forEach(f=>{
          s[f.status]=(s[f.status]||0)+1;
          if(f.ativo&&f.data_proxima_afericao&&f.status!=="em_afericao"){
            const d=new Date(f.data_proxima_afericao);
            if(d<hoje)s.vencidas++;
            else if(diasEntre(hoje,d)<=7)s.proximas++;
          }
          if(f.ativo&&f.catalogo?.requer_licenca&&f.data_validade_licenca){
            const d=new Date(f.data_validade_licenca);
            if(d<hoje)s.licencasVencidas++;
            else if(diasEntre(hoje,d)<=7)s.licencasProximas++;
          }
        });
        // Estoque por quantidade entra nos mesmos totais (senão "Total de Ferramentas"/
        // "Disponíveis"/"Com Colaborador" ficam menores que o real, divergindo da tela Estoque).
        (dataE||[]).forEach(e=>{
          const emprestada=empMap[e.id]||0;
          s.total+=e.quantidade_total;
          s.disponivel+=Math.max(0,e.quantidade_total-emprestada);
          s.com_colaborador+=emprestada;
          if(e.catalogo?.requer_licenca&&e.data_validade_licenca){
            const d=new Date(e.data_validade_licenca);
            if(d<hoje)s.licencasVencidas++;
            else if(diasEntre(hoje,d)<=7)s.licencasProximas++;
          }
        });
        setStats(s);
      }

      // Atingimento por filial contra os 228 itens da checklist oficial (não só o que já foi
      // cadastrado) — um item conta como "disponível" pra uma filial quando o catálogo vinculado
      // tem pelo menos 1 unidade/pool disponível NAQUELA filial especificamente.
      const filiaisView=profile.userType==="admin_geral"?filiais:profile.filiaisAcesso;
      const porFilial=new Map(); // filial_id -> Set(catalogo_id disponível)
      (unidObrig||[]).forEach(u=>{
        if(u.status!=="disponivel")return;
        if(!porFilial.has(u.filial_id))porFilial.set(u.filial_id,new Set());
        porFilial.get(u.filial_id).add(u.catalogo_id);
      });
      (poolObrig||[]).forEach(p=>{
        if(p.quantidade_total-(empMap[p.id]||0)<=0)return;
        if(!porFilial.has(p.filial_id))porFilial.set(p.filial_id,new Set());
        porFilial.get(p.filial_id).add(p.catalogo_id);
      });
      const totalChecklist=(checklist||[]).length;
      const ating=filiaisView.map(f=>{
        const disponiveisSet=porFilial.get(f.id)||new Set();
        const disponiveis=(checklist||[]).filter(c=>c.catalogo_id&&disponiveisSet.has(c.catalogo_id)).length;
        return{filialId:f.id,filialNome:f.nome,total:totalChecklist,disponiveis,
          pct:totalChecklist>0?Math.round(disponiveis/totalChecklist*100):null};
      });
      if(!cancelled){
        setAtingimento(ating);
        setChecklistFaltando((checklist||[]).filter(c=>!c.catalogo_id));
      }
      setLoading(false);
    }
    load();
    return()=>{cancelled=true;};
  },[profile.filialIds,profile.userType]);

  if(loading)return <div style={{padding:60,textAlign:"center"}}><Spinner size={22}/></div>;
  if(!stats)return null;

  return(
    <div className="fade" style={{padding:"28px 32px"}}>
      <h1 style={{fontSize:22,fontWeight:800,color:"#111827",margin:"0 0 4px"}}>Dashboard</h1>
      <p style={{fontSize:13,color:"#6B7280",margin:"0 0 24px"}}>
        Visão geral {profile.userType==="admin_geral"?"de todas as filiais":
          profile.filiaisAcesso.length>1?`das filiais ${profile.filiaisAcesso.map(f=>f.nome).join(", ")}`:`da filial ${profile.filialNome}`}.
      </p>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(200px,1fr))",gap:14,marginBottom:14}}>
        <StatCard label="Total de Ferramentas" value={stats.total} Icon={Wrench} color={BLUE}/>
        <StatCard label="Disponíveis" value={stats.disponivel||0} Icon={PackageCheck} color="#059669"/>
        <StatCard label="Com Colaborador" value={stats.com_colaborador||0} Icon={Users} color={BLUE}/>
        <StatCard label="Em Aferição" value={stats.em_afericao||0} Icon={Clock} color="#D97706"/>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(200px,1fr))",gap:14,marginBottom:14}}>
        <StatCard label="Em Reparo" value={stats.em_conserto||0} Icon={PackageX} color="#DB2777"/>
        <StatCard label="Extraviadas" value={stats.extraviada||0} Icon={AlertTriangle} color="#B91C1C"/>
        <StatCard label="Aferições Vencidas" value={stats.vencidas} Icon={AlertCircle} color="#B91C1C"/>
        <StatCard label="Aferições Próx. 7 dias" value={stats.proximas} Icon={Calendar} color="#D97706"/>
      </div>
      {(stats.licencasVencidas>0||stats.licencasProximas>0)&&(
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(200px,1fr))",gap:14,marginBottom:14}}>
          <StatCard label="Licenças Vencidas" value={stats.licencasVencidas} Icon={AlertCircle} color="#B91C1C"/>
          <StatCard label="Licenças Próx. 7 dias" value={stats.licencasProximas} Icon={Calendar} color="#D97706"/>
        </div>
      )}
      {atingimento&&atingimento.length>0&&(
        <div style={{background:"#fff",border:"1px solid #F1F5F9",borderRadius:14,padding:"18px 20px",marginBottom:14}}>
          <h2 style={{fontSize:15,fontWeight:800,color:"#111827",margin:"0 0 3px"}}>Atingimento de Ferramentas Obrigatórias</h2>
          <p style={{fontSize:11.5,color:"#9CA3AF",margin:"0 0 14px"}}>
            Contra os 228 itens da checklist oficial Especifer/Iveco: quantos a filial tem disponível agora.
          </p>
          <div style={{display:"flex",flexDirection:"column",gap:12}}>
            {atingimento.map(a=>{
              const cor=a.pct===null?"#9CA3AF":a.pct>=90?"#059669":a.pct>=70?"#D97706":"#B91C1C";
              return(
                <div key={a.filialId} style={{display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
                  <div style={{width:130,fontSize:13,fontWeight:700,color:"#374151",flexShrink:0}}>{a.filialNome}</div>
                  <div style={{flex:1,minWidth:120,height:8,borderRadius:99,background:"#F1F5F9",overflow:"hidden"}}>
                    <div style={{width:`${a.pct||0}%`,height:"100%",background:cor,borderRadius:99,transition:"width .3s"}}/>
                  </div>
                  <div style={{minWidth:130,textAlign:"right",fontSize:12.5,fontWeight:700,color:cor,flexShrink:0}}>
                    {a.disponiveis}/{a.total} · {a.pct}%
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}
      {profile.userType!=="colaborador"&&checklistFaltando.length>0&&(
        <div style={{background:"#fff",border:"1px solid #F1F5F9",borderRadius:14,padding:"18px 20px",marginBottom:14}}>
          <h2 style={{fontSize:15,fontWeight:800,color:"#111827",margin:"0 0 3px"}}>
            Itens do checklist ainda não cadastrados ({checklistFaltando.length})
          </h2>
          <p style={{fontSize:11.5,color:"#9CA3AF",margin:"0 0 14px"}}>
            Nenhuma filial tem essas ferramentas no sistema — assim que forem cadastradas com o
            código correto, entram na contagem automaticamente.
          </p>
          <div style={{display:"flex",flexDirection:"column",gap:6}}>
            {checklistFaltando.map(c=>(
              <div key={c.id} style={{display:"flex",gap:10,alignItems:"baseline",padding:"6px 0",borderTop:"1px solid #F8FAFC"}}>
                <span style={{fontSize:11,fontWeight:700,color:"#9CA3AF",minWidth:80,flexShrink:0}}>{c.codigo}</span>
                <span style={{fontSize:12.5,color:"#374151"}}>{c.descricao}</span>
              </div>
            ))}
          </div>
        </div>
      )}
      {profile.userType!=="colaborador"&&<UsoAoVivoPanel/>}
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════
   FERRAMENTAS
   ══════════════════════════════════════════════════════════════ */
// Cadastro de ferramenta = 2 passos num modal só:
// 1) escolher um TIPO já existente no catálogo, ou (só admin_geral) cadastrar um tipo novo;
// 2) conforme a categoria do tipo escolhido, pedir OU um código de unidade individual
//    (ferramentas_unidade) OU uma quantidade a somar ao estoque da filial (estoque_pool).
function ModalNovaFerramenta({onClose,onSaved,filiais,categorias,catalogos,profile,editandoUnidade}){
  const isAdminGeral=profile.userType==="admin_geral";
  const[modoNovoTipo,setModoNovoTipo]=useState(false);
  const[catalogoId,setCatalogoId]=useState(editandoUnidade?.catalogo_id||"");
  const[novoTipoNome,setNovoTipoNome]=useState("");
  const[novoTipoCategoriaId,setNovoTipoCategoriaId]=useState("");
  const[novoTipoObrigatoria,setNovoTipoObrigatoria]=useState(false);
  const[codigo,setCodigo]=useState(editandoUnidade?.codigo||"");
  const[quantidade,setQuantidade]=useState("");
  const filiaisPermitidas=profile.userType==="admin_geral"?filiais:filiais.filter(f=>profile.filialIds.includes(f.id));
  const[filialId,setFilialId]=useState(editandoUnidade?.filial_id||(filiaisPermitidas.length===1?filiaisPermitidas[0].id:""));
  const[dataProximaAfericao,setDataProximaAfericao]=useState(editandoUnidade?.data_proxima_afericao||"");
  const[observacoes,setObservacoes]=useState(editandoUnidade?.observacoes||"");
  const[localizacao,setLocalizacao]=useState(editandoUnidade?.localizacao||"");
  const[numeroLicenca,setNumeroLicenca]=useState(editandoUnidade?.numero_licenca||"");
  const[dataValidadeLicenca,setDataValidadeLicenca]=useState(editandoUnidade?.data_validade_licenca||"");
  const[loading,setLoading]=useState(false);
  const[error,setError]=useState("");

  const catalogoAtual=editandoUnidade
    ? catalogos.find(c=>c.id===editandoUnidade.catalogo_id)
    : catalogos.find(c=>c.id===catalogoId);
  const categoriaAtual=modoNovoTipo
    ? categorias.find(c=>c.id===novoTipoCategoriaId)
    : categorias.find(c=>c.id===catalogoAtual?.categoria_id);
  const requerAfericao=!!categoriaAtual?.requer_afericao;
  const requerLicenca=!!catalogoAtual?.requer_licenca;
  const controleIndividual=categoriaAtual?.controle_individual!==false; // default true se ainda não sabemos

  async function salvar(){
    setError("");
    if(editandoUnidade){
      if(!codigo){setError("Preencha o código.");return;}
      setLoading(true);
      const{error:err}=await supabase.from("ferramentas_unidade")
        .update({codigo,observacoes:observacoes||null,localizacao:localizacao.trim()||null,
          numero_licenca:requerLicenca?(numeroLicenca.trim()||null):null,
          data_validade_licenca:requerLicenca?(dataValidadeLicenca||null):null}).eq("id",editandoUnidade.id);
      setLoading(false);
      if(err){setError(traduzErro(err));return;}
      onSaved();
      return;
    }

    let finalCatalogoId=catalogoId;
    if(modoNovoTipo){
      if(!novoTipoNome.trim()){setError("Preencha o nome da nova ferramenta.");return;}
      setLoading(true);
      const{data,error:err}=await supabase.from("ferramentas_catalogo")
        .insert({nome:novoTipoNome.trim(),categoria_id:novoTipoCategoriaId||null,obrigatoria:novoTipoObrigatoria}).select().single();
      if(err){setLoading(false);setError(traduzErro(err));return;}
      finalCatalogoId=data.id;
    }
    if(!finalCatalogoId){setError("Selecione a ferramenta.");return;}
    if(!filialId){setError("Selecione a filial.");return;}

    if(controleIndividual){
      if(!codigo){setError("Preencha o código da unidade.");return;}
      setLoading(true);
      const{error:err}=await supabase.from("ferramentas_unidade").insert({
        catalogo_id:finalCatalogoId,filial_id:filialId,codigo,
        data_proxima_afericao:requerAfericao?(dataProximaAfericao||null):null,observacoes:observacoes||null,
        localizacao:localizacao.trim()||null,
        numero_licenca:requerLicenca?(numeroLicenca.trim()||null):null,
        data_validade_licenca:requerLicenca?(dataValidadeLicenca||null):null,
      });
      setLoading(false);
      if(err){setError(traduzErro(err));return;}
    }else{
      const qtd=parseInt(quantidade,10);
      if(!qtd||qtd<=0){setError("Informe uma quantidade válida.");return;}
      setLoading(true);
      const{data:existente}=await supabase.from("estoque_pool").select("id,quantidade_total")
        .eq("catalogo_id",finalCatalogoId).eq("filial_id",filialId).maybeSingle();
      let err;
      if(existente){
        ({error:err}=await supabase.from("estoque_pool").update({quantidade_total:existente.quantidade_total+qtd}).eq("id",existente.id));
      }else{
        ({error:err}=await supabase.from("estoque_pool").insert({catalogo_id:finalCatalogoId,filial_id:filialId,quantidade_total:qtd,localizacao:localizacao.trim()||null}));
      }
      setLoading(false);
      if(err){setError(traduzErro(err));return;}
    }
    onSaved();
  }

  return(
    <Modal title={editandoUnidade?"Editar Unidade":"Nova Ferramenta"} onClose={onClose}
      footer={<>
        <BtnSecondary onClick={onClose}>Cancelar</BtnSecondary>
        <BtnPrimary onClick={salvar} loading={loading}>{editandoUnidade?"Salvar Alterações":"Cadastrar"}</BtnPrimary>
      </>}>
      <ErrorBox>{error}</ErrorBox>
      <div style={{display:"flex",flexDirection:"column",gap:14}}>
        {!editandoUnidade&&(modoNovoTipo?(
          <>
            <Field label="Nome da nova ferramenta" required>
              <input value={novoTipoNome} onChange={e=>setNovoTipoNome(e.target.value)} style={inputStyle} placeholder="Ex.: Torquímetro 1/2&quot;"/>
            </Field>
            <Field label="Categoria" hint={novoTipoCategoriaId?(requerAfericao?"Essa categoria exige controle de aferição — cada unidade terá código próprio.":controleIndividual?"Cada unidade terá código próprio.":"Controlado por quantidade (sem código individual)."):null}>
              <select value={novoTipoCategoriaId} onChange={e=>setNovoTipoCategoriaId(e.target.value)} style={inputStyle}>
                <option value="">Sem categoria</option>
                {categorias.map(c=><option key={c.id} value={c.id}>{c.nome}</option>)}
              </select>
            </Field>
            <label style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer",fontSize:13,color:"#374151"}}>
              <input type="checkbox" checked={novoTipoObrigatoria} onChange={e=>setNovoTipoObrigatoria(e.target.checked)}/>
              Ferramenta obrigatória (checklist Iveco/Especifer)
            </label>
            {isAdminGeral&&<button type="button" onClick={()=>setModoNovoTipo(false)}
              style={{border:"none",background:"none",color:BLUE,fontSize:12,fontWeight:700,cursor:"pointer",padding:0,textAlign:"left"}}>
              ← Usar uma ferramenta já cadastrada
            </button>}
          </>
        ):(
          <>
            <Field label="Ferramenta" required>
              <select value={catalogoId} onChange={e=>setCatalogoId(e.target.value)} style={inputStyle}>
                <option value="">Selecione...</option>
                {catalogos.map(c=><option key={c.id} value={c.id}>{c.nome}</option>)}
              </select>
            </Field>
            {catalogoId&&<div style={{fontSize:12,color:"#6B7280"}}>
              {controleIndividual?"Cada unidade terá código próprio.":"Controlado por quantidade (sem código individual)."}
              {requerAfericao&&" Exige controle de aferição."}
            </div>}
            {isAdminGeral&&<button type="button" onClick={()=>setModoNovoTipo(true)}
              style={{border:"none",background:"none",color:BLUE,fontSize:12,fontWeight:700,cursor:"pointer",padding:0,textAlign:"left"}}>
              + Cadastrar uma ferramenta nova
            </button>}
          </>
        ))}

        <Field label="Filial" required>
          <select value={filialId} onChange={e=>setFilialId(e.target.value)} style={inputStyle}
            disabled={!!editandoUnidade||filiaisPermitidas.length===1}>
            <option value="">Selecione...</option>
            {filiaisPermitidas.map(f=><option key={f.id} value={f.id}>{f.nome}</option>)}
          </select>
        </Field>

        {controleIndividual?(
          <Field label="Código de identificação da unidade" required>
            <input value={codigo} onChange={e=>setCodigo(e.target.value)} style={inputStyle} placeholder="Ex.: FER-0123"/>
          </Field>
        ):(!editandoUnidade&&
          <Field label="Quantidade a adicionar ao estoque" required hint="Se já existir estoque desse tipo nessa filial, soma à quantidade atual.">
            <input type="number" min="1" value={quantidade} onChange={e=>setQuantidade(e.target.value)} style={inputStyle} placeholder="Ex.: 5"/>
          </Field>
        )}
        {!editandoUnidade&&controleIndividual&&requerAfericao&&<Field label="Próxima aferição programada" hint="Deixe em branco se ainda não tiver uma data definida.">
          <input type="date" value={dataProximaAfericao} onChange={e=>setDataProximaAfericao(e.target.value)} style={inputStyle}/>
        </Field>}
        {controleIndividual&&requerLicenca&&<>
          <Field label="Número da licença" hint="Chave/identificador da licença de software, se houver.">
            <input value={numeroLicenca} onChange={e=>setNumeroLicenca(e.target.value)} style={inputStyle} placeholder="Ex.: XXXX-XXXX-XXXX"/>
          </Field>
          <Field label="Validade da licença">
            <input type="date" value={dataValidadeLicenca} onChange={e=>setDataValidadeLicenca(e.target.value)} style={inputStyle}/>
          </Field>
        </>}
        <Field label="Localização na filial" hint="Onde essa ferramenta fica guardada fisicamente (ex.: Armário 3, Gaveta 2).">
          <input value={localizacao} onChange={e=>setLocalizacao(e.target.value)} style={inputStyle} placeholder="Ex.: Armário 3, Gaveta 2"/>
        </Field>
        <Field label="Observações">
          <textarea value={observacoes} onChange={e=>setObservacoes(e.target.value)} style={{...inputStyle,minHeight:70,resize:"vertical"}}/>
        </Field>
      </div>
    </Modal>
  );
}

function traduzErro(err){
  const m=err?.message||"";
  if(/duplicate key/i.test(m))return "Já existe um registro com esse código/nome.";
  return m||"Ocorreu um erro. Tente novamente.";
}

function ModalAcao({ferramenta,tipo,onClose,onDone,pessoasFilial}){
  const[pessoaId,setPessoaId]=useState("");
  const[observacao,setObservacao]=useState("");
  const[loading,setLoading]=useState(false);
  const[error,setError]=useState("");

  const CONFIG={
    retirada:{title:"Registrar Retirada",needsPessoa:true,confirmLabel:"Confirmar Retirada"},
    devolucao:{title:"Registrar Devolução",needsPessoa:false,confirmLabel:"Confirmar Devolução"},
    envio_afericao:{title:"Enviar para Aferição",needsPessoa:false,confirmLabel:"Confirmar Envio"},
    retorno_afericao:{title:"Registrar Retorno da Aferição",needsPessoa:false,confirmLabel:"Confirmar Retorno"},
    extravio:{title:"Reportar Extravio",needsPessoa:false,confirmLabel:"Reportar Extravio",danger:true},
    baixa:{title:"Dar Baixa na Ferramenta",needsPessoa:false,confirmLabel:"Confirmar Baixa",danger:true},
    reativacao:{title:"Reativar Ferramenta",needsPessoa:false,confirmLabel:"Reativar"},
  }[tipo];

  async function confirmar(){
    if(CONFIG.needsPessoa&&!pessoaId){setError("Selecione com quem a ferramenta vai ficar.");return;}
    setLoading(true);setError("");
    const{error:err}=await supabase.from("movimentacoes").insert({
      ferramenta_id:ferramenta.id,tipo,
      pessoa_responsavel_id:CONFIG.needsPessoa?pessoaId:null,
      observacao:observacao||null,
    });
    setLoading(false);
    if(err){setError(err.message||"Não foi possível registrar. Tente novamente.");return;}
    onDone();
  }

  return(
    <Modal title={CONFIG.title} onClose={onClose}
      footer={<>
        <BtnSecondary onClick={onClose}>Cancelar</BtnSecondary>
        <BtnPrimary onClick={confirmar} loading={loading} danger={CONFIG.danger}>{CONFIG.confirmLabel}</BtnPrimary>
      </>}>
      <ErrorBox>{error}</ErrorBox>
      <div style={{marginBottom:16,padding:12,borderRadius:10,background:"#F9FAFB",border:"1px solid #F1F5F9"}}>
        <div style={{fontSize:11,color:"#9CA3AF",fontWeight:700,textTransform:"uppercase",marginBottom:2}}>{ferramenta.codigo}</div>
        <div style={{fontSize:14,fontWeight:700,color:"#111827"}}>{nomeLimpo(ferramenta.catalogo?.nome,ferramenta.codigo)}</div>
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:14}}>
        {CONFIG.needsPessoa&&(
          <Field label="Com quem a ferramenta vai ficar" required>
            <select value={pessoaId} onChange={e=>setPessoaId(e.target.value)} style={inputStyle}>
              <option value="">Selecione...</option>
              {pessoasFilial.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
            </select>
          </Field>
        )}
        <Field label="Observação (opcional)">

function ModalTransferencia({ferramenta,filiais,profile,onClose,onDone}){
  const opcoesDestino=filiais.filter(f=>f.id!==ferramenta.filial_id);
  const[filialDestinoId,setFilialDestinoId]=useState(opcoesDestino.length===1?opcoesDestino[0].id:"");
  const[motivo,setMotivo]=useState("");
  const[loading,setLoading]=useState(false);
  const[error,setError]=useState("");

  async function confirmar(){
    if(!filialDestinoId){setError("Selecione a filial de destino.");return;}
    setLoading(true);setError("");
    const{error:err}=await supabase.from("transferencias_ferramenta").insert({
      ferramenta_id:ferramenta.id,filial_destino_id:filialDestinoId,motivo:motivo.trim()||null,
    });
    setLoading(false);
    if(err){setError(err.message||"Não foi possível solicitar a transferência.");return;}
    onDone();
  }

  return(
    <Modal title="Transferir para Outra Filial" onClose={onClose}
      footer={<><BtnSecondary onClick={onClose}>Cancelar</BtnSecondary>
        <BtnPrimary onClick={confirmar} loading={loading}>Solicitar Transferência</BtnPrimary></>}>
      <ErrorBox>{error}</ErrorBox>
      <div style={{marginBottom:16,padding:12,borderRadius:10,background:"#F9FAFB",border:"1px solid #F1F5F9"}}>
        <div style={{fontSize:11,color:"#9CA3AF",fontWeight:700,textTransform:"uppercase",marginBottom:2}}>{ferramenta.codigo}</div>
        <div style={{fontSize:14,fontWeight:700,color:"#111827"}}>{nomeLimpo(ferramenta.catalogo?.nome,ferramenta.codigo)}</div>
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:14}}>
        <Field label="Filial de destino" required>
          <select value={filialDestinoId} onChange={e=>setFilialDestinoId(e.target.value)} style={inputStyle}>
            <option value="">Selecione...</option>
            {opcoesDestino.map(f=><option key={f.id} value={f.id}>{f.nome}</option>)}
          </select>
        </Field>
        <Field label="Motivo (opcional)">
          <textarea value={motivo} onChange={e=>setMotivo(e.target.value)} style={{...inputStyle,minHeight:70,resize:"vertical"}}/>
        </Field>
        <p style={{fontSize:11.5,color:"#9CA3AF",margin:0}}>
          A transferência fica pendente até um gestor da filial de destino aprovar. A ferramenta fica bloqueada (indisponível para retirada) enquanto isso.
        </p>
      </div>
    </Modal>
  );
}
function ModalTransferenciaEstoque({estoque,filiais,profile,onClose,onDone}){
  const opcoesDestino=filiais.filter(f=>f.id!==estoque.filial_id);
  const[filialDestinoId,setFilialDestinoId]=useState(opcoesDestino.length===1?opcoesDestino[0].id:"");
  const[quantidade,setQuantidade]=useState("");
  const[motivo,setMotivo]=useState("");
  const[loading,setLoading]=useState(false);
  const[error,setError]=useState("");

  async function confirmar(){
    const qtd=parseInt(quantidade,10);
    if(!filialDestinoId){setError("Selecione a filial de destino.");return;}
    if(!qtd||qtd<=0){setError("Informe uma quantidade válida.");return;}
    if(qtd>estoque.quantidade_disponivel){setError(`Só há ${estoque.quantidade_disponivel} unidade(s) disponível(is) pra transferir.`);return;}
    setLoading(true);setError("");
    const{error:err}=await supabase.from("transferencias_estoque").insert({
      catalogo_id:estoque.catalogo_id,filial_origem_id:estoque.filial_id,filial_destino_id:filialDestinoId,
      quantidade:qtd,motivo:motivo.trim()||null,
    });
    setLoading(false);
    if(err){setError(err.message||"Não foi possível solicitar a transferência.");return;}
    onDone();
  }

  return(
    <Modal title="Transferir Estoque para Outra Filial" onClose={onClose}
      footer={<><BtnSecondary onClick={onClose}>Cancelar</BtnSecondary>
        <BtnPrimary onClick={confirmar} loading={loading}>Solicitar Transferência</BtnPrimary></>}>
      <ErrorBox>{error}</ErrorBox>
      <div style={{marginBottom:16,padding:12,borderRadius:10,background:"#F9FAFB",border:"1px solid #F1F5F9"}}>
        <div style={{fontSize:14,fontWeight:700,color:"#111827"}}>{estoque.catalogo?.nome}</div>
        <div style={{fontSize:11.5,color:"#9CA3AF",marginTop:2}}>{estoque.quantidade_disponivel} disponível(is) pra transferir</div>
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:14}}>
        <Field label="Filial de destino" required>
          <select value={filialDestinoId} onChange={e=>setFilialDestinoId(e.target.value)} style={inputStyle}>
            <option value="">Selecione...</option>
            {opcoesDestino.map(f=><option key={f.id} value={f.id}>{f.nome}</option>)}
          </select>
        </Field>
        <Field label="Quantidade" required>
          <input type="number" min="1" max={estoque.quantidade_disponivel} value={quantidade}
            onChange={e=>setQuantidade(e.target.value)} style={inputStyle} placeholder="Ex.: 2"/>
        </Field>
        <Field label="Motivo (opcional)">
          <textarea value={motivo} onChange={e=>setMotivo(e.target.value)} style={{...inputStyle,minHeight:70,resize:"vertical"}}/>
        </Field>
        <p style={{fontSize:11.5,color:"#9CA3AF",margin:0}}>
          A quantidade solicitada fica reservada (sai da disponibilidade da filial de origem) até um gestor da filial de destino decidir. Se rejeitada ou cancelada, volta pra origem.
        </p>
      </div>
    </Modal>
  );
}

function TransferenciasPendentesPanel({profile,onChanged}){
  const[lista,setLista]=useState([]);
  const[loading,setLoading]=useState(true);
  const[processando,setProcessando]=useState(null);
  const[error,setError]=useState("");

  async function load(){
    setLoading(true);
    const[{data:dF},{data:dE}]=await Promise.all([
      supabase.from("transferencias_ferramenta")
        .select("*, ferramenta:ferramenta_id(codigo,catalogo:catalogo_id(nome)), origem:filial_origem_id(nome), destino:filial_destino_id(nome), solicitante:solicitante_id(name)")
        .eq("status","pendente").order("created_at",{ascending:false}),
      supabase.from("transferencias_estoque")
        .select("*, catalogo:catalogo_id(nome), origem:filial_origem_id(nome), destino:filial_destino_id(nome), solicitante:solicitante_id(name)")
        .eq("status","pendente").order("created_at",{ascending:false}),
    ]);
    const combinada=[
      ...(dF||[]).map(t=>({...t,tipo:"ferramenta"})),
      ...(dE||[]).map(t=>({...t,tipo:"estoque"})),
    ].sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
    setLista(combinada);
    setLoading(false);
  }
  useEffect(()=>{load();},[]);

  useEffect(()=>{
    const ch=supabase.channel("transferencias-rt")
      .on("postgres_changes",{event:"*",schema:"public",table:"transferencias_ferramenta"},()=>load())
      .on("postgres_changes",{event:"*",schema:"public",table:"transferencias_estoque"},()=>load())
      .subscribe();
    return()=>supabase.removeChannel(ch);
  },[]);

  async function decidir(t,status){
    setProcessando(t.id);setError("");
    const tabela=t.tipo==="estoque"?"transferencias_estoque":"transferencias_ferramenta";
    const{error:err}=await supabase.from(tabela).update({status}).eq("id",t.id);
    setProcessando(null);
    if(err){setError(err.message||"Não foi possível registrar a decisão.");return;}
    load();
    onChanged?.();
  }

  if(!loading&&lista.length===0)return null;

  return(
    <div style={{marginBottom:18,background:"#fff",border:"1px solid #F1F5F9",borderRadius:14,padding:"16px 18px"}}>
      <div style={{fontSize:13,fontWeight:800,color:"#111827",marginBottom:10,display:"flex",alignItems:"center",gap:7}}>
        <ArrowLeftRight size={15} color={BLUE}/>Transferências Pendentes{lista.length>0?` (${lista.length})`:""}
      </div>
      <ErrorBox>{error}</ErrorBox>
      {loading?<div style={{padding:16,textAlign:"center"}}><Spinner size={16}/></div>:(
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          {lista.map(t=>{
            const podeDecidir=profile.userType==="admin_geral"||profile.gerentePosVendas;
            const podeCancelar=!podeDecidir&&t.solicitante_id===profile.id;
            return(
              <div key={t.id} style={{padding:"10px 14px",background:"#FAFAFA",border:"1px solid #F1F5F9",borderRadius:10,
                display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:10}}>
                <div>
                  <div style={{fontSize:13,fontWeight:700,color:"#111827"}}>
                    {t.tipo==="estoque"?`${t.quantidade}× ${t.catalogo?.nome}`:`${t.ferramenta?.codigo} — ${nomeLimpo(t.ferramenta?.catalogo?.nome,t.ferramenta?.codigo)}`}
                  </div>
                  <div style={{fontSize:11.5,color:"#6B7280"}}>
                    {t.origem?.nome} → {t.destino?.nome} · solicitado por {t.solicitante?.name} em {fmtDateTime(t.created_at)}
                  </div>
                  {t.motivo&&<div style={{fontSize:12,color:"#374151",marginTop:2}}>{t.motivo}</div>}
                </div>
                <div style={{display:"flex",gap:6}}>
                  {podeDecidir&&<>
                    <BtnPrimary onClick={()=>decidir(t,"aprovada")} loading={processando===t.id}>Aprovar</BtnPrimary>
                    <BtnSecondary onClick={()=>decidir(t,"rejeitada")} disabled={processando===t.id}>Rejeitar</BtnSecondary>
                  </>}
                  {podeCancelar&&<BtnSecondary onClick={()=>decidir(t,"cancelada")} disabled={processando===t.id}>Cancelar</BtnSecondary>}
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function FerramentasView({profile,filiais,categorias,catalogos,pessoas,reloadCatalogos}){
  const isMobile=useIsMobile();
  const[unidades,setUnidades]=useState([]);
  const[estoques,setEstoques]=useState([]);
  const[loading,setLoading]=useState(true);
  const[busca,setBusca]=useState("");
  const[filtroStatus,setFiltroStatus]=useState("");
  const[filtroFilial,setFiltroFilial]=useState("");
  const[filtroCategoria,setFiltroCategoria]=useState("");
  const[filtroObrigatoria,setFiltroObrigatoria]=useState("");
  const[selecionada,setSelecionada]=useState(null);
  const[grupoSelecionado,setGrupoSelecionado]=useState(null);
  const[estoqueSelecionado,setEstoqueSelecionado]=useState(null);
  const[novaAberta,setNovaAberta]=useState(false);
  const[retiradaAberta,setRetiradaAberta]=useState(false);
  const[devolucaoAberta,setDevolucaoAberta]=useState(false);
  const[exportarAberto,setExportarAberto]=useState(false);
  const[filtrosModalAberto,setFiltrosModalAberto]=useState(false);
  const[filtrosCompacto,setFiltrosCompacto]=useState(false);
  const isAdmin=profile.userType==="admin_geral"||profile.userType==="admin_area";
  const mostrarFiltroFilial=profile.userType==="admin_geral"||profile.filiaisAcesso.length>1;
  const filiaisOpcoesFiltro=profile.userType==="admin_geral"?filiais:profile.filiaisAcesso;
  const filtrosAtivos=[filtroStatus,filtroFilial,filtroCategoria,filtroObrigatoria].filter(Boolean).length;

  // Mede se a barra de busca+filtros+exportar cabe numa linha só (em vez de chutar um
  // breakpoint de largura) — um medidor invisível com nowrap fica sobreposto por cima,
  // reportando a largura "natural" do conteúdo; se ela estourar a largura real disponível
  // da barra, os filtros viram um botão único que abre modal. Reage a resize da janela e
  // também da própria barra (ex.: recolher/expandir a sidebar), nos dois sentidos.
  const barraFiltrosRef=useRef(null);
  const medidorFiltrosRef=useRef(null);
  useEffect(()=>{
    if(isMobile){setFiltrosCompacto(false);return;}
    function medir(){
      if(!barraFiltrosRef.current||!medidorFiltrosRef.current)return;
      setFiltrosCompacto(medidorFiltrosRef.current.scrollWidth>barraFiltrosRef.current.clientWidth);
    }
    medir();
    const ro=new ResizeObserver(medir);
    ro.observe(barraFiltrosRef.current);
    window.addEventListener("resize",medir);
    return()=>{ro.disconnect();window.removeEventListener("resize",medir);};
  },[isMobile,mostrarFiltroFilial,categorias.length]);

  async function load(){
    setLoading(true);
    let qU=supabase.from("ferramentas_unidade").select("*, colaborador_atual:colaborador_atual_id(name), catalogo:catalogo_id(nome,categoria_id,obrigatoria,requer_licenca)").order("codigo");
    let qE=supabase.from("estoque_pool").select("*, catalogo:catalogo_id(nome,categoria_id,obrigatoria,requer_licenca)");
    if(filtroFilial){qU=qU.eq("filial_id",filtroFilial);qE=qE.eq("filial_id",filtroFilial);}
    else if(profile.userType!=="admin_geral"){qU=qU.in("filial_id",profile.filialIds);qE=qE.in("filial_id",profile.filialIds);}
    if(filtroStatus)qU=qU.eq("status",filtroStatus);
    if(filtroCategoria){
      const idsCat=catalogos.filter(c=>c.categoria_id===filtroCategoria).map(c=>c.id);
      const filtro=idsCat.length?idsCat:["00000000-0000-0000-0000-000000000000"];
      qU=qU.in("catalogo_id",filtro);qE=qE.in("catalogo_id",filtro);
    }
    const[{data:dU},{data:dE},{data:emp}]=await Promise.all([
      qU, qE, supabase.from("emprestimos").select("estoque_id,quantidade").is("data_devolucao",null),
    ]);
    setUnidades(dU||[]);
    const empMap={};
    (emp||[]).forEach(e=>{empMap[e.estoque_id]=(empMap[e.estoque_id]||0)+e.quantidade;});
    setEstoques((dE||[]).map(e=>({...e,quantidade_emprestada:empMap[e.id]||0,quantidade_disponivel:e.quantidade_total-(empMap[e.id]||0)})));
    setLoading(false);
  }
  useEffect(()=>{load();},[filtroStatus,filtroFilial,filtroCategoria,profile.filialIds]);

  const unidadesFiltradas=useMemo(()=>{
    const t=busca.trim().toLowerCase();
    return unidades.filter(f=>{
      if(t&&!(f.codigo.toLowerCase().includes(t)||(f.catalogo?.nome||"").toLowerCase().includes(t)))return false;
      if(filtroObrigatoria==="sim"&&!f.catalogo?.obrigatoria)return false;
      if(filtroObrigatoria==="nao"&&f.catalogo?.obrigatoria)return false;
      return true;
    });
  },[unidades,busca,filtroObrigatoria]);
  const estoquesFiltrados=useMemo(()=>{
    if(filtroStatus)return [];
    const t=busca.trim().toLowerCase();
    return estoques.filter(e=>{
      if(t&&!(e.catalogo?.nome||"").toLowerCase().includes(t))return false;
      if(filtroObrigatoria==="sim"&&!e.catalogo?.obrigatoria)return false;
      if(filtroObrigatoria==="nao"&&e.catalogo?.obrigatoria)return false;
      return true;
    });
  },[estoques,busca,filtroStatus,filtroObrigatoria]);

  // Visão de dois níveis: agrupa as unidades individuais por catálogo — a lista mostra
  // um item por tipo de ferramenta (quantas temos daquela), e o clique abre o detalhe
  // com os códigos e localizações individuais de cada unidade.
  const gruposUnidades=useMemo(()=>{
    const porCatalogo=new Map();
    unidadesFiltradas.forEach(u=>{
      const key=u.catalogo_id;
      if(!porCatalogo.has(key)){
        porCatalogo.set(key,{catalogoId:key,nome:u.catalogo?.nome||"—",categoriaId:u.catalogo?.categoria_id,obrigatoria:!!u.catalogo?.obrigatoria,itens:[]});
      }
      porCatalogo.get(key).itens.push(u);
    });
    return Array.from(porCatalogo.values()).sort((a,b)=>a.nome.localeCompare(b.nome));
  },[unidadesFiltradas]);

  const pessoasFilial=useMemo(()=>{
    const fid=(selecionada||grupoSelecionado?.itens?.[0])?.filial_id;
    return pessoas.filter(p=>p.filial_id===fid);
  },[pessoas,selecionada,grupoSelecionado]);

  // totalItens conta unidades físicas de verdade — pool soma quantidade_total, não nº de linhas
  // (uma linha de pool pode representar várias unidades, ex.: "Suporte Câmbio" qtd=4).
  const totalItens=unidadesFiltradas.length+estoquesFiltrados.reduce((s,e)=>s+e.quantidade_total,0);
  const totalLinhas=gruposUnidades.length+estoquesFiltrados.length;

  function abrirGrupo(grupo){
    if(grupo.itens.length===1)setSelecionada(grupo.itens[0]);
    else setGrupoSelecionado(grupo);
  }

  function exportarEstoque(formato){
    const filialNome=id=>filiais.find(f=>f.id===id)?.nome||"";
    const linhas=[
      ...unidadesFiltradas.map(u=>({
        Codigo:u.codigo,Ferramenta:u.catalogo?.nome||"",Filial:filialNome(u.filial_id),
        Status:STATUS_FERRAMENTA_INFO[u.status]?.label||u.status,
        ComQuem:u.colaborador_atual?.name||"",Quantidade:"",
      })),
      ...estoquesFiltrados.map(e=>({
        Codigo:"",Ferramenta:e.catalogo?.nome||"",Filial:filialNome(e.filial_id),
        Status:"Estoque (por quantidade)",ComQuem:"",Quantidade:`${e.quantidade_disponivel}/${e.quantidade_total}`,
      })),
    ];
    if(formato==="excel"){
      const ws=XLSX.utils.json_to_sheet(linhas.map(l=>({
        Código:l.Codigo,Ferramenta:l.Ferramenta,Filial:l.Filial,Status:l.Status,"Com quem":l.ComQuem,Quantidade:l.Quantidade,
      })));
      const wb=XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb,ws,"Estoque");
      XLSX.writeFile(wb,"estoque_ferramentaria.xlsx");
    }else{
      const{jsPDF}=window.jspdf;
      const doc=new jsPDF({orientation:"landscape"});
      doc.setFontSize(14);
      doc.text("Estoque de Ferramentaria",14,15);
      doc.setFontSize(9);
      doc.text(`Gerado em ${fmtDateTime(new Date().toISOString())}`,14,21);
      doc.autoTable({
        startY:26,
        head:[["Código","Ferramenta","Filial","Status","Com quem","Quantidade"]],
        body:linhas.map(l=>[l.Codigo,l.Ferramenta,l.Filial,l.Status,l.ComQuem,l.Quantidade]),
        styles:{fontSize:8},
        headStyles:{fillColor:[25,85,255]},
      });
      doc.save("estoque_ferramentaria.pdf");
    }
  }

  return(
    <div className="fade" style={{padding:isMobile?"20px 16px":"28px 32px"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:20,flexWrap:"wrap",gap:12}}>

/* ══════════════════════════════════════════════════════════════
   RETIRADAS — fluxo do ferramenteiro (leitor de crachá → matrícula)
   ══════════════════════════════════════════════════════════════ */
// Lê o código de barras do crachá (filial+matrícula juntos, ex.:
// 055003000830 → filial 55003 + matrícula 830) ou aceita digitação
// manual curta (só a matrícula, escopada pelo RLS à filial de quem
// está operando a tela).
async function buscarColaboradorPorCracha(bruto,filiais){
  const digitos=bruto.replace(/\D/g,"");
  let query=supabase.from("profiles").select("id,name,filial_id,matricula").eq("is_active",true);
  if(digitos.length>=8){
    const meio=Math.floor(digitos.length/2);
    const filialCodigo=String(parseInt(digitos.slice(0,meio),10));
    const matriculaLida=String(parseInt(digitos.slice(meio),10));
    const filial=(filiais||[]).find(f=>f.codigo_barras&&String(parseInt(f.codigo_barras,10))===filialCodigo);
    if(!filial)return{error:"Filial não reconhecida nesse código de barras. Verifique o cadastro em Configurações → Filiais."};
    query=query.eq("filial_id",filial.id).eq("matricula",matriculaLida);
  }else{
    query=query.eq("matricula",digitos||bruto);
  }
  const{data,error}=await query.maybeSingle();
  if(error||!data)return{error:"Matrícula não encontrada ou colaborador inativo."};
  return{colaborador:data};
}

// Enquanto o leitor de código de barras não chega: seletor manual por filial + busca de
// nome/matrícula, como alternativa à leitura de crachá. As duas abas produzem o mesmo formato
// de colaborador ({id,name,filial_id,matricula}), então o resto do fluxo (retirada/devolução)
// nem sabe qual delas foi usada.
function SeletorColaborador({filiais,profile,onEncontrado}){
  const[modo,setModo]=useState("manual");
  const tabStyle=ativo=>({flex:1,padding:"9px 14px",borderRadius:8,border:"none",cursor:"pointer",
    fontSize:12.5,fontWeight:700,background:ativo?"#fff":"transparent",color:ativo?BLUE:"#6B7280",
    boxShadow:ativo?"0 1px 3px rgba(0,0,0,.08)":"none"});
  return(
    <div>
      <div style={{display:"flex",gap:4,marginBottom:16,padding:4,background:"#F3F4F6",borderRadius:11}}>
        <button type="button" onClick={()=>setModo("manual")} style={tabStyle(modo==="manual")}>Buscar Filial / Nome</button>
        <button type="button" onClick={()=>setModo("cracha")} style={tabStyle(modo==="cracha")}>Ler Crachá</button>
      </div>
      {modo==="manual"
        ?<BuscaManualColaborador filiais={filiais} profile={profile} onEncontrado={onEncontrado}/>
        :<CampoBuscaCracha filiais={filiais} onEncontrado={onEncontrado}/>}
    </div>
  );
}
function BuscaManualColaborador({filiais,profile,onEncontrado}){
  const filiaisPermitidas=profile.userType==="admin_geral"?filiais:profile.filiaisAcesso;
  const[filialId,setFilialId]=useState(filiaisPermitidas.length===1?filiaisPermitidas[0].id:"");
  const[busca,setBusca]=useState("");
  const[lista,setLista]=useState([]);
  const[loading,setLoading]=useState(false);
  const[erro,setErro]=useState("");

  useEffect(()=>{
    if(!filialId){setLista([]);return;}
    setLoading(true);setErro("");
    supabase.from("profiles").select("id,name,filial_id,matricula")
      .eq("filial_id",filialId).eq("is_active",true).order("name")
      .then(({data,error})=>{
        setLoading(false);
        if(error){setErro("Não foi possível carregar os colaboradores dessa filial.");return;}
        setLista(data||[]);
      });
  },[filialId]);

  const t=busca.trim().toLowerCase();
  const filtrada=lista.filter(c=>!t||c.name.toLowerCase().includes(t)||(c.matricula||"").toLowerCase().includes(t));

  return(
    <div style={{display:"flex",flexDirection:"column",gap:14}}>
      <ErrorBox>{erro}</ErrorBox>
      <Field label="Filial" required>
        <select value={filialId} onChange={e=>setFilialId(e.target.value)} style={inputStyle}>
          <option value="">Selecione a filial...</option>
          {filiaisPermitidas.map(f=><option key={f.id} value={f.id}>{f.nome}</option>)}
        </select>
      </Field>
      {filialId&&(
        <Field label="Buscar por nome ou matrícula">
          <div style={{position:"relative"}}>
            <Search size={14} color="#9CA3AF" style={{position:"absolute",left:12,top:"50%",transform:"translateY(-50%)"}}/>
            <input value={busca} onChange={e=>setBusca(e.target.value)} placeholder="Digite o nome ou a matrícula..."
              style={{...inputStyle,paddingLeft:34}} autoFocus/>
          </div>
        </Field>
      )}
      {loading?<div style={{padding:30,textAlign:"center"}}><Spinner size={18}/></div>:
      filialId&&filtrada.length===0?<EmptyState icon={Users} title="Nenhum colaborador encontrado" text="Ajuste a busca ou confira o cadastro em Gestão de Usuários."/>:
      filialId&&(
        <div style={{display:"flex",flexDirection:"column",gap:6,maxHeight:340,overflowY:"auto"}}>
          {filtrada.map(c=>(
            <button key={c.id} type="button" onClick={()=>onEncontrado(c)} className="lift"
              style={{display:"flex",alignItems:"center",gap:10,padding:"10px 14px",borderRadius:10,
                border:"1px solid #F1F5F9",background:"#fff",cursor:"pointer",textAlign:"left"}}>
              <div style={{width:32,height:32,borderRadius:"50%",background:BLUE,color:"#fff",display:"flex",
                alignItems:"center",justifyContent:"center",fontWeight:700,fontSize:11.5,flexShrink:0}}>{getInitials(c.name)}</div>
              <div style={{minWidth:0,flex:1}}>
                <div style={{fontSize:13.5,fontWeight:700,color:"#111827"}}>{c.name}</div>
                <div style={{fontSize:11.5,color:"#9CA3AF"}}>{c.matricula?`Matrícula ${c.matricula}`:"Sem matrícula"}</div>
              </div>
              <ChevronRight size={16} color="#9CA3AF"/>
            </button>
          ))}
        </div>
      )}
    </div>
  );
}
function CampoBuscaCracha({filiais,onEncontrado}){
  const[matricula,setMatricula]=useState("");
  const[buscando,setBuscando]=useState(false);
  const[erro,setErro]=useState("");
  const ref=useRef(null);
  useEffect(()=>{ref.current?.focus();},[]);

  async function buscar(e){
    e.preventDefault();
    if(!matricula.trim())return;
    setBuscando(true);setErro("");
    const res=await buscarColaboradorPorCracha(matricula.trim(),filiais);
    setBuscando(false);
    if(res.error){setErro(res.error);return;}
    onEncontrado(res.colaborador);
  }

  return(
    <form onSubmit={buscar} style={{display:"flex",flexDirection:"column",gap:16}}>
      <ErrorBox>{erro}</ErrorBox>
      <Field label="Matrícula do colaborador" hint="Passe o crachá no leitor (ele digita e envia sozinho) ou digite e aperte Enter.">
        <input ref={ref} value={matricula} onChange={e=>setMatricula(e.target.value)} autoFocus
          style={{...inputStyle,fontSize:24,padding:"18px 14px",textAlign:"center",letterSpacing:"3px"}} placeholder="0-550XX-00-XXXX"/>
      </Field>
      <BtnPrimary type="submit" loading={buscando}><ScanLine size={16}/>Buscar</BtnPrimary>
    </form>
  );
}
