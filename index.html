function ConfiguracoesView({profile,filiais,categorias,pessoas,reloadFiliais,reloadCategorias,activeSection,setActiveSection,onAvatarChanged}){
  const isMobile=useIsMobile();
  const[error,setError]=useState("");
  const[catError,setCatError]=useState("");
  const[editandoFilial,setEditandoFilial]=useState(null);
  const[editandoCategoria,setEditandoCategoria]=useState(null);
  const[novaCategoriaAberta,setNovaCategoriaAberta]=useState(false);
  const[novaFilialAberta,setNovaFilialAberta]=useState(false);
  const isAdminGeral=profile.userType==="admin_geral";

  async function excluirFilial(f){
    if(!window.confirm(`Excluir a filial "${f.nome}"? Ela some das listas, mas o histórico de ferramentas continua íntegro.`))return;
    setError("");
    const{error:err}=await supabase.from("filiais").update({ativo:false}).eq("id",f.id);
    if(err){setError(traduzErro(err));return;}
    reloadFiliais();
  }

  async function excluirCategoria(c){
    if(!window.confirm(`Excluir a categoria "${c.nome}"? Ela some das listas, mas ferramentas já cadastradas continuam com ela.`))return;
    setCatError("");
    const{error:err}=await supabase.from("categorias_ferramenta").update({ativo:false}).eq("id",c.id);
    if(err){setCatError(traduzErro(err));return;}
    reloadCategorias();
  }

  const SECTIONS=[
    {id:"perfil",label:"Meu Perfil",Icon:UserCheck},
    {id:"usuarios",label:"Gestão de Usuários",Icon:UserPlus},
    ...(isAdminGeral?[{id:"filiais",label:"Filiais",Icon:Building2}]:[]),
    ...(isAdminGeral?[{id:"categorias",label:"Categorias",Icon:Tag}]:[]),
  ];

  return(
    <div className="fade" style={{padding:isMobile?"20px 16px":"28px 32px"}}>
      <div style={{marginBottom:24}}>
        <h1 style={{fontSize:20,fontWeight:800,color:"#111827",margin:0}}>Configurações</h1>
        <p style={{fontSize:13,color:"#9CA3AF",marginTop:3}}>Gerencie configurações do sistema</p>
      </div>

      {/* alignItems controla o eixo cruzado do flex — que é a LARGURA quando a direção vira
          coluna no mobile. "flex-start" (bom no desktop, lado a lado) faz o conteúdo encolher
          pra largura do próprio texto em vez de ocupar a tela toda quando empilhado. */}
      <div style={{display:"flex",gap:isMobile?14:20,alignItems:isMobile?"stretch":"flex-start",flexDirection:isMobile?"column":"row"}}>

        {SECTIONS.length>1&&(
        <div style={isMobile
          ?{width:"100%",display:"flex",gap:8}
          :{width:210,flexShrink:0,background:"#fff",borderRadius:14,
            border:"1px solid #F1F5F9",boxShadow:"0 1px 4px rgba(0,0,0,.04)",padding:8}}>
          {!isMobile&&(
            <p style={{fontSize:10,fontWeight:700,color:"#94A3B8",textTransform:"uppercase",
              letterSpacing:".07em",padding:"6px 10px 4px"}}>Configurações</p>
          )}
          {SECTIONS.map(s=>{
            const active=activeSection===s.id;
            return(
              <button key={s.id} onClick={()=>setActiveSection(s.id)}
                style={isMobile
                  ?{flex:1,display:"flex",alignItems:"center",justifyContent:"center",gap:7,padding:"10px 8px",
                    borderRadius:11,cursor:"pointer",
                    border:`1.5px solid ${active?BLUE:"#E5E7EB"}`,
                    background:active?`${BLUE}10`:"#fff",
                    color:active?BLUE:"#6B7280",fontWeight:700,fontSize:13,transition:"all .15s"}
                  :{width:"100%",display:"flex",alignItems:"center",gap:9,padding:"9px 12px",
                    borderRadius:10,border:"none",cursor:"pointer",textAlign:"left",
                    background:active?`${BLUE}10`:"transparent",
                    color:active?BLUE:"#374151",fontWeight:active?700:500,fontSize:13,
                    transition:"all .15s"}}>
                <s.Icon size={15} color={active?BLUE:"#9CA3AF"}/>
                {s.label}
              </button>
            );
          })}
        </div>
        )}

        <div style={{flex:1,minWidth:0}}>

          {activeSection==="perfil"&&(
            <MeuPerfilCard profile={profile} onAvatarChanged={onAvatarChanged}/>
          )}

          {activeSection==="usuarios"&&(
            <GestaoUsuariosView profile={profile} filiais={filiais}/>
          )}

          {activeSection==="filiais"&&isAdminGeral&&(<>
            <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:12,marginBottom:2}}>
              <p style={{fontSize:15,fontWeight:800,color:"#111827",margin:0}}>Filiais</p>
              <BtnPrimary onClick={()=>setNovaFilialAberta(true)}><Plus size={15}/>Nova Filial</BtnPrimary>
            </div>
            <p style={{fontSize:12,color:"#9CA3AF",margin:"2px 0 16px"}}>
              Filiais com oficina cadastradas no sistema. O "Código da filial" é a primeira metade do código lido
              no crachá do colaborador (ex.: no código 055003000830, a filial é 55003) — necessário para a tela de Retiradas
              reconhecer automaticamente a filial ao ler o crachá.
            </p>
            <div style={{maxWidth:520}}>
              <ErrorBox>{error}</ErrorBox>
              <div style={{display:"flex",flexDirection:"column",gap:8}}>
                {filiais.map(f=><FilialRow key={f.id} filial={f}
                  onEditar={()=>setEditandoFilial(f)} onExcluir={()=>excluirFilial(f)}/>)}
              </div>
            </div>
          </>)}

          {activeSection==="categorias"&&isAdminGeral&&(<>
            <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:12,marginBottom:2}}>
              <p style={{fontSize:15,fontWeight:800,color:"#111827",margin:0}}>Categorias de Ferramenta</p>
              <BtnPrimary onClick={()=>setNovaCategoriaAberta(true)}><Plus size={15}/>Nova Categoria</BtnPrimary>
            </div>
            <p style={{fontSize:12,color:"#9CA3AF",margin:"2px 0 16px"}}>
              Categorias marcadas como "exige aferição" pedem data de aferição e liberam a ação "Enviar p/ Aferição" nas ferramentas dessa categoria.
            </p>
            <div style={{maxWidth:480}}>
              <ErrorBox>{catError}</ErrorBox>
              <div style={{display:"flex",flexDirection:"column",gap:8}}>
                {categorias.map(c=>(
                  <div key={c.id} style={{padding:"10px 14px",background:"#fff",border:"1px solid #F1F5F9",borderRadius:10,
                    display:"flex",alignItems:"center",justifyContent:"space-between",gap:10,flexWrap:"wrap"}}>
                    <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                      <span style={{fontSize:13.5,fontWeight:600,color:"#111827"}}>{c.nome}</span>
                      {c.requer_afericao&&<span style={{fontSize:11,fontWeight:700,color:"#D97706",background:"#FFFBEB",
                        padding:"3px 9px",borderRadius:99,whiteSpace:"nowrap"}}>Exige aferição</span>}
                    </div>
                    <div style={{display:"flex",gap:6}}>
                      <button onClick={()=>setEditandoCategoria(c)} title="Editar" style={iconBtnStyle}><Pencil size={13}/></button>
                      <button onClick={()=>excluirCategoria(c)} title="Excluir" style={{...iconBtnStyle,color:"#B91C1C"}}><Trash2 size={13}/></button>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </>)}

        </div>
      </div>
      {editandoFilial&&<ModalEditarFilial filial={editandoFilial}
        onClose={()=>setEditandoFilial(null)} onSaved={()=>{setEditandoFilial(null);reloadFiliais();}}/>}
      {editandoCategoria&&<ModalEditarCategoria categoria={editandoCategoria}
        onClose={()=>setEditandoCategoria(null)} onSaved={()=>{setEditandoCategoria(null);reloadCategorias();}}/>}
      {novaCategoriaAberta&&<ModalNovaCategoria
        onClose={()=>setNovaCategoriaAberta(false)} onSaved={()=>{setNovaCategoriaAberta(false);reloadCategorias();}}/>}
      {novaFilialAberta&&<ModalNovaFilial
        onClose={()=>setNovaFilialAberta(false)} onSaved={()=>{setNovaFilialAberta(false);reloadFiliais();}}/>}
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════
   APP
   ══════════════════════════════════════════════════════════════ */
function App(){
  const[status,setStatus]=useState(_RESET_TOKEN?"reset_password":"loading");
  const[profile,setProfile]=useState(null);
  const[filiais,setFiliais]=useState([]);
  const[categorias,setCategorias]=useState([]);
  const[catalogos,setCatalogos]=useState([]);
  const[pessoas,setPessoas]=useState([]);
  const[activeNav,setActiveNav]=useState(null);
  const[configSection,setConfigSection]=useState("perfil");
  const[notifications,setNotifications]=useState([]);
  const[notifOpen,setNotifOpen]=useState(false);
  const[viewingProfile,setViewingProfile]=useState(false);
  const isMobile=useIsMobile();

  async function loadFiliais(){
    const{data}=await supabase.from("filiais").select("*").eq("ativo",true).order("nome");
    setFiliais(data||[]);
  }
  async function loadCategorias(){
    const{data}=await supabase.from("categorias_ferramenta").select("*").eq("ativo",true).order("nome");
    setCategorias(data||[]);
  }
  async function loadCatalogos(){
    const{data}=await supabase.from("ferramentas_catalogo").select("*").eq("ativo",true).order("nome");
    setCatalogos(data||[]);
  }
  async function loadPessoas(){
    const{data}=await supabase.from("profiles").select("id,name,filial_id,matricula").eq("is_active",true).order("name");
    setPessoas(data||[]);
  }
  async function loadNotifications(userId){
    const{data}=await supabase.from("notifications").select("*").eq("user_id",userId).order("created_at",{ascending:false}).limit(30);
    setNotifications(data||[]);
  }

  async function initUser(session){
    const{data:prof,error}=await supabase.from("profiles").select("*, filial:filial_id(nome)").eq("id",session.user.id).single();
    if(error||!prof||!prof.is_active){
      await supabase.auth.signOut();
      setStatus("login");
      return;
    }
    const{data:acessos}=await supabase.from("acessos_filial").select("filial_id, filial:filial_id(nome)").eq("profile_id",prof.id);
    const extras=(acessos||[]).map(a=>({id:a.filial_id,nome:a.filial?.nome}));
    const filiaisAcesso=prof.filial_id?[{id:prof.filial_id,nome:prof.filial?.nome},...extras]:extras;
    const filialIds=filiaisAcesso.map(f=>f.id);
    setProfile({
      id:prof.id,name:prof.name,email:prof.email,userType:prof.user_type,
      filialId:prof.filial_id,filialNome:prof.filial?.nome,color:prof.color,avatarUrl:prof.avatar_url||null,
      filialIds,filiaisAcesso,gerentePosVendas:!!prof.gerente_pos_vendas,
    });
    setActiveNav(prof.user_type==="colaborador"?"ferramentas":"dashboard");
    await Promise.all([loadFiliais(),loadCategorias(),loadCatalogos(),loadPessoas(),loadNotifications(prof.id)]);
    setStatus("ready");
  }

  useEffect(()=>{
    if(_RESET_TOKEN)return;
    supabase.auth.getSession().then(({data})=>{
      if(data.session)initUser(data.session);
      else setStatus("login");
    });
  },[]);

  async function handleLogout(){
    await supabase.auth.signOut();
    setProfile(null);setStatus("login");
  }
  function handleAvatarChanged(url){
    setProfile(prev=>prev?{...prev,avatarUrl:url}:prev);
  }

  if(status==="loading")return <LoadingScreen/>;
  if(status==="reset_password")return <ResetPasswordScreen/>;
  if(status==="login")return <LoginScreen onLoginSuccess={initUser}/>;
  if(!profile)return <LoadingScreen/>;

  const markNotifRead=async(id)=>{
    await supabase.from("notifications").update({is_read:true}).eq("id",id);
    setNotifications(prev=>prev.map(n=>n.id===id?{...n,is_read:true}:n));
  };
  const markAllNotifRead=async()=>{
    const ids=notifications.filter(n=>!n.is_read).map(n=>n.id);
    if(ids.length===0)return;
    await supabase.from("notifications").update({is_read:true}).in("id",ids);
    setNotifications(prev=>prev.map(n=>({...n,is_read:true})));
  };

  const commonProps={profile,filiais,categorias,catalogos,pessoas};
  let content=null;
  if(viewingProfile){
    content=<div style={{padding:isMobile?"20px 16px":"28px 32px"}}>
      <button onClick={()=>setViewingProfile(false)} style={{display:"flex",alignItems:"center",gap:6,border:"none",
        background:"none",color:"#6B7280",fontSize:13,fontWeight:600,cursor:"pointer",padding:0,marginBottom:16}}>
        <ArrowLeft size={14}/>Voltar
      </button>
      <MeuPerfilCard profile={profile} onAvatarChanged={handleAvatarChanged}/>
    </div>;
  }else{
    switch(activeNav){
      case "dashboard": content=<DashboardView {...commonProps}/>; break;
      case "ferramentas": content=<FerramentasView {...commonProps} reloadCatalogos={loadCatalogos}/>; break;
      case "movimentacoes": content=<MovimentacoesView {...commonProps}/>; break;
      case "relatorios": content=<RelatoriosView {...commonProps}/>; break;
      case "configuracoes": content=<ConfiguracoesView {...commonProps} reloadFiliais={loadFiliais} reloadCategorias={loadCategorias}
        activeSection={configSection} setActiveSection={setConfigSection} onAvatarChanged={handleAvatarChanged}/>; break;
      default: content=null;
    }
  }

  const unreadCount=notifications.filter(n=>!n.is_read).length;

  return(
    <div className="app-shell" style={{display:"flex",background:"#F8FAFC"}}>
      {/* Menu lateral: só no desktop (largura ≥768 e não é tablet em pé). Em celular/tablet
          em pé, a navegação vira a barra fixa no rodapé (MobileBottomNav), abaixo. */}
      {!isMobile&&(
        <Sidebar currentUser={profile} activeNav={activeNav} setActiveNav={id=>{setActiveNav(id);setViewingProfile(false);}}
          onLogout={handleLogout} onViewProfile={()=>setViewingProfile(true)}
          notifications={notifications} notifOpen={notifOpen} onNotifToggle={()=>setNotifOpen(v=>!v)}
          markNotifRead={markNotifRead} markAllNotifRead={markAllNotifRead}/>
      )}
      <div style={{flex:1,minWidth:0,minHeight:0,display:"flex",flexDirection:"column",overflow:"hidden"}}>
        {isMobile&&(
          <div style={{height:56,flexShrink:0,display:"flex",alignItems:"center",gap:10,padding:"0 12px 0 16px",
            borderBottom:"1px solid #F1F5F9",background:"#fff",position:"sticky",top:0,zIndex:50}}
            onClick={()=>notifOpen&&setNotifOpen(false)}>
            <div style={{flex:1,minWidth:0}}><Logo color="#0A0A0B" height={13}/></div>
            <div style={{position:"relative"}}>
              <button onClick={e=>{e.stopPropagation();setNotifOpen(v=>!v);}}
                style={{width:34,height:34,border:"none",background:"#F8FAFC",borderRadius:9,cursor:"pointer",
                  display:"flex",alignItems:"center",justifyContent:"center",position:"relative",color:"#374151"}}>
                <Bell size={17}/>
                {unreadCount>0&&(
                  <span style={{position:"absolute",top:2,right:2,minWidth:14,height:14,borderRadius:99,
                    background:"#EF4444",border:"2px solid #fff",display:"flex",alignItems:"center",
                    justifyContent:"center",fontSize:8,fontWeight:800,color:"#fff",padding:"0 2px",lineHeight:1}}>
                    {unreadCount>9?"9+":unreadCount}
                  </span>
                )}
              </button>
              {notifOpen&&(
                <div style={{position:"fixed",right:12,top:52,zIndex:600}} onClick={e=>e.stopPropagation()}>
                  <NotificationPanel notifications={notifications} onMarkRead={markNotifRead}
                    onMarkAllRead={markAllNotifRead} onClose={()=>setNotifOpen(false)}/>
                </div>
              )}
            </div>
            <MobileHeaderAvatar currentUser={profile}
              onViewProfile={()=>setViewingProfile(true)} onLogout={handleLogout}/>
          </div>
        )}
        <main style={{flex:1,overflowY:"auto",minWidth:0,minHeight:0,overflowAnchor:"none",
          overscrollBehaviorY:"contain",WebkitOverflowScrolling:"touch"}}
          onClick={()=>notifOpen&&setNotifOpen(false)}>
          {content}
        </main>
        {isMobile&&(
          <MobileBottomNav items={navItemsFor(profile.userType)}
            activeNav={viewingProfile?null:activeNav}
            setActiveNav={id=>{setActiveNav(id);setViewingProfile(false);}}/>
        )}
      </div>
    </div>
  );
}

const root=createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
</body>
</html>
